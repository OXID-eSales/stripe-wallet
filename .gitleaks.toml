# gitleaks configuration
#
# Added 2026-09-04 after an audit found a real Stripe test secret key and
# webhook signing secret committed to this repository. The point of this file
# is that the next one fails CI instead of being found months later.
#
# The allowlist below is deliberately made of narrow, fixture-shaped patterns
# rather than blanket path exclusions: a real key pasted into a unit test must
# still trip the scan. A real Stripe key is `(sk|pk)_(test|live)_51` followed
# by ~100 mixed characters; none of the patterns here can match one.

title = "OXID Stripe module"

[extend]
useDefault = true

[allowlist]
description = "Vendored code, generated artefacts, and obvious test fixtures"

paths = [
  # Third-party and generated. Not ours to police, and huge.
  '''(^|/)vendor/''',
  '''(^|/)node_modules/''',
  '''\.min\.(js|css)$''',
  '''(^|/)package-lock\.json$''',
  # Local scratch: worktrees and Playwright/report output are not part of a
  # checkout, but a developer running gitleaks locally would drown in them.
  '''(^|/)\.claude/''',
  '''(^|/)(playwright-report|test-results)/''',
  # Only the test runners' report output. Dev-log `reports/` directories hold
  # prose and run logs and are scanned (subsprint 138a, 2026-10-22: a run log
  # under docs/.../reports/ held a client secret and a session id).
  '''(^|/)tests/(.*/)?reports/''',
  '''gitleaks-report\.json$''',
  # Gitignored, local-only development notes. Prose about API keys, not keys:
  # checked 2026-09-04, nothing of a real key's shape in there. Excluded so a
  # developer running gitleaks by hand gets the same clean signal CI does.
  '''(^|/)docs/dev_logs/''',
]

regexes = [
  # Placeholders this repo ships on purpose.
  '''(sk|pk|rk)_(test|live)_(replace_with|your_)[A-Za-z0-9_]*''',
  '''whsec_(replace_with|your_)[A-Za-z0-9_]*''',
  # Fixture keys in unit tests: spelled-out words and repeated digits, never
  # the shape of a real key.
  '''(?i)(sk|pk|rk)_(test|live)_(51)?(abc|xyz)[a-z0-9]{0,20}''',
  '''(sk|pk|rk)_(test|live)_(4242)+''',
  '''(?i)(sk|pk|rk)_(test|live)_(dummy|example|placeholder|fake|test|key|secret|alias)[a-z0-9_]*''',
  '''(?i)whsec_(test|dummy|example|fake|placeholder|abc|xyz|live)[a-z0-9_]*''',
  # Stripe client secrets in fixtures, e.g. pi_test_123_secret_xyz.
  '''(pi|seti|cs)_(test|live)_[A-Za-z0-9]{0,12}_secret_[A-Za-z0-9_]*''',
]

# Two things the default rules miss, and this repository leaked both.
#
# gitleaks' stripe-access-token rule covers sk_/rk_ keys only. The webhook
# signing secret is not covered at all - and of the two values that were
# published here, it is the one that matters most: it lets anyone forge a
# signed webhook, and this module advances order state on webhooks.

# Note on capture groups in the rules below: gitleaks reports capture group 1
# as the finding's *secret*, and an allowlist regex is matched against that
# secret by default. A capturing (test|live) would therefore reduce the secret
# to the word "test" and no fixture allowlist above could ever match it. Keep
# these groups non-capturing.

[[rules]]
id = "stripe-webhook-signing-secret"
description = "Stripe webhook signing secret (whsec_)"
regex = '''whsec_[A-Za-z0-9]{24,}'''
keywords = ["whsec_"]

[[rules]]
id = "stripe-publishable-key"
description = "Stripe publishable key (pk_live_/pk_test_)"
# Public by design, so not an emergency - but it names the account and has no
# business being committed. Shaped match only: pk_ + mode + 51 + ~100 chars.
regex = '''pk_(?:test|live)_51[A-Za-z0-9]{80,}'''
keywords = ["pk_test_51", "pk_live_51"]

# There is no default rule for a Mollie API key either, and a live_ one is a
# full-access production credential. Length is not contractual (mollie-payment
# review 2026-10-14 D-L3: an exactly-30 match let differently sized real keys
# commit clean), so 25 or more.

[[rules]]
id = "mollie-api-key"
description = "Mollie API key (live_/test_ + 25 or more characters)"
regex = '''\b(?:live|test)_[A-Za-z0-9]{25,}'''
keywords = ["live_", "test_"]

# Added 2026-10-22 (subsprint 138a, audit of 2026-10-21). Four shapes the
# default rules miss and that were found committed across our repositories:
# a Stripe Checkout Session client secret and an OXID force_sid in a dev-log
# run log, a PayPal access token in copied SDK docs, and a demo-shop login
# (e-mail + password) in e2e fixtures and .env.dist files.

[[rules]]
id = "stripe-checkout-session-client-secret"
description = "Stripe Checkout Session client secret (cs_test_/cs_live_ ... _secret_ ...)"
regex = '''cs_(?:test|live)_[A-Za-z0-9]+_secret_[A-Za-z0-9]+'''
keywords = ["cs_test_", "cs_live_"]

[[rules]]
id = "oxid-force-sid"
description = "OXID session id passed as force_sid (a pasted one hijacks that session)"
regex = '''force_sid=[0-9a-z]{32}'''
keywords = ["force_sid"]

[[rules]]
id = "paypal-access-token"
description = "PayPal OAuth access token (A21AA...)"
regex = '''A21AA[A-Za-z0-9_-]{60,}'''
keywords = ["a21aa"]

# A login pair: `password:` / `Password:` / `PASSWORD=` followed by a value,
# with an e-mail address on the same line or within the two lines before or
# after it. Two rules because gitleaks reports capture group 1 as the secret
# and an alternation would leave that group empty for one of the orders.
# Lines are matched explicitly ([^\n]*) because the rules run against the
# whole fragment, not line by line.

[[rules]]
id = "credential-pair-email-then-password"
description = "Login e-mail followed within two lines by password: / password= and a value"
regex = '''(?i)[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}[^\n]*(?:\n[^\n]*){0,2}password\s*[:=]\s*["'`]?([^\s"'`,;)]{3,})'''
keywords = ["password"]

[[rules]]
id = "credential-pair-password-then-email"
description = "password: / password= and a value followed within two lines by a login e-mail"
regex = '''(?i)password\s*[:=]\s*["'`]?([^\s"'`,;)]{3,})[^\n]*(?:\n[^\n]*){0,2}[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}'''
keywords = ["password"]
