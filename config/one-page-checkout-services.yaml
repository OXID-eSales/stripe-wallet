# One-Page Checkout Service Configuration
# Wire up all components for one-time checkout flow

services:
  # Encryption Service
  encryption.service:
    class: OxidEsales\StripeWallet\Component\Service\EncryptionService
    arguments:
      $encryptionKey: '%env(PAYMENT_ENCRYPTION_KEY)%'
      $logger: '@logger'

  # OnePageController (GraphQL Resolver)
  graphql.controller.onepage:
    class: OxidEsales\StripeWallet\Component\Controller\GraphQL\OnePageController
    arguments:
      $eventDispatcher: '@event.dispatcher'
      $encryptionService: '@encryption.service'
      $logger: '@logger'
    tags:
      - { name: 'graphql.resolver' }

  # Event Handlers
  event.handler.payment_initiated:
    class: OxidEsales\StripeWallet\Component\EventSystem\EventHandler\PaymentInitiatedEventHandler
    arguments:
      $paymentAdapter: '@payment.adapter.stripe'
      $transactionRepository: '@repository.transaction'
      $eventDispatcher: '@event.dispatcher'
      $logger: '@logger'
    tags:
      - { name: 'event.subscriber', event: 'PaymentInitiatedEvent', priority: 100 }

  event.handler.payment_completed:
    class: OxidEsales\StripeWallet\Component\EventSystem\EventHandler\PaymentCompletedEventHandler
    arguments:
      $logger: '@logger'
    tags:
      - { name: 'event.subscriber', event: 'PaymentCompletedEvent', priority: 100 }

  event.handler.checkout_abandoned:
    class: OxidEsales\StripeWallet\Component\EventSystem\EventHandler\CheckoutAbandonedEventHandler
    arguments:
      $logger: '@logger'
      # Add additional services as needed:
      # $inventoryService: '@inventory.service'
      # $trackingService: '@abandonment.tracking.service'
      # $emailService: '@email.service'
      # $analyticsService: '@analytics.service'
    tags:
      - { name: 'event.subscriber', event: 'CheckoutAbandonedEvent', priority: 100 }

  # Additional subscribers can be added here:
  # - Email notification handler
  # - Order status updater
  # - Fulfillment trigger
  # - Analytics tracker
  # - Inventory management
  # - Cart recovery system

# Environment variables required:
# PAYMENT_ENCRYPTION_KEY - AES-256 encryption key (32 bytes, base64 encoded)
