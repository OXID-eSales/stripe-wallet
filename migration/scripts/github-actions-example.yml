# GitHub Actions - Example Workflow for OXID Setup with Payment Module
# Place this in .github/workflows/setup.yml

name: OXID Setup with Payment Module

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  setup:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: example
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, mbstring, pdo

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install OXID module
        run: |
          composer require osc/stripe-wallet:dev-main
          vendor/bin/oe-console oe:module:install-configuration osc/stripe

      - name: Reset database
        run: vendor/bin/oe-console oe:database:reset --force

      - name: Run migrations
        run: |
          cd extensions/stripe
          vendor/bin/doctrine-migrations migrate --configuration=migration/migrations.yml --db-configuration=migration/migrations-db.php --no-interaction

      # CRITICAL: Drop FK constraints before demodata
      - name: Drop FK constraints
        run: |
          cd extensions/stripe/migration/scripts
          ./setup-helper.sh drop-fk

      # Install demodata (this would fail without dropping FK)
      - name: Install demodata
        run: vendor/bin/oe-console oe:setup:demodata --no-interaction

      # CRITICAL: Re-add FK constraints after demodata
      - name: Re-add FK constraints
        run: |
          cd extensions/stripe/migration/scripts
          ./setup-helper.sh add-fk

      - name: Activate module
        run: vendor/bin/oe-console oe:module:activate osc/stripe

      - name: Run tests
        run: |
          cd extensions/stripe
          vendor/bin/phpunit

      - name: Verify database integrity
        run: |
          mysql -h 127.0.0.1 -u root -proot example -e "
            SELECT
              TABLE_NAME,
              COUNT(*) as FK_COUNT
            FROM information_schema.TABLE_CONSTRAINTS
            WHERE CONSTRAINT_TYPE = 'FOREIGN KEY'
              AND TABLE_SCHEMA = 'example'
              AND TABLE_NAME LIKE 'osc_payment_%'
            GROUP BY TABLE_NAME;
          "
