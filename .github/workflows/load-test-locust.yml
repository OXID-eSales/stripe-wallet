name: Load Test (Locust)

# Manual only. Two target modes:
#   1. In-Action shop (default, `url` empty): builds a throwaway OXID shop
#      INSIDE the GitHub Action (mirrors development.yml's
#      `install_shop_with_module` job), runs Locust against it, then tears it
#      down. Stripe test mode is guaranteed (we set it) and there is no remote
#      container to go down.
#   2. External shop (`url` provided): skips the build/teardown but DOES seed
#      the shop over SSH (200 `loadtest_user_*` accounts + high stock), the same
#      way load-test.yml does. The external shop is reached via the SHOP_HOST /
#      SHOP_SSH_* secrets, so `url` is expected to point at that same host. It is
#      ASSUMED to be in Stripe TEST mode — this workflow does not verify mode.
#      Pass `product_anid` so the checkout scenario has a buyable product (the
#      in-Action path auto-discovers one; an external SEO shop exposes no anid=
#      links to scrape).
#
# Scope caveat: Locust is HTTP-level. It exercises page rendering, session +
# basket, and the Stripe `createCheckoutSession` endpoint. It does NOT drive the
# Stripe hosted-checkout redirect or the 3DS browser flow.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'External shop URL to test (no trailing slash). Leave empty to build a throwaway shop inside this Action.'
        required: false
        default: ''
        type: string
      product_anid:
        description: 'Buyable product OXID for the checkout scenario (external URL only; in-Action shop auto-discovers one).'
        required: false
        default: ''
        type: string
      shop_branch:
        description: 'OXID eShop CE branch to build (in-Action shop only). Switch it across runs to compare core speed.'
        required: true
        default: 'b-7.4.x'
        type: choice
        options: [b-7.4.x, b-7.5.x, b-7.3.x]
      users:
        description: 'Concurrent virtual users'
        required: true
        default: '50'
        type: string
      spawn_rate:
        description: 'Spawn rate (users/sec) — ramps the user count up'
        required: true
        default: '5'
        type: string
      duration:
        description: 'Run time (e.g. 30s, 2m, 5m)'
        required: true
        default: '2m'
        type: string
      scenarios:
        description: 'Scenario preset'
        required: true
        default: 'all'
        type: choice
        options: [all, browse, checkout]
      fail_p95_ms:
        description: 'p95 latency budget (ms); breach fails the job'
        required: true
        default: '2000'
        type: string
      fail_pct_error:
        description: '% failed requests budget; breach fails the job'
        required: true
        default: '1.0'
        type: string
      chart_yscale:
        description: 'Capacity-chart Y axis (response time).'
        required: true
        default: 'log10'
        type: choice
        options: [log10, linear, ln]
      chart_xscale:
        description: 'Capacity-chart X axis (concurrent users).'
        required: true
        default: 'linear'
        type: choice
        options: [linear, log10, ln]

concurrency:
  group: load-test-locust
  cancel-in-progress: false   # never auto-cancel an in-flight load run

env:
  PACKAGE_NAME: 'oxid-esales/stripe-wallet'
  PHP_VERSION: '8.2'
  MYSQL_VERSION: '8.0'
  TEMPLATE_ENGINE: 'twig'
  # payment-base + the Stripe module stay on our dev branch regardless of the
  # shop core branch under test, so we measure pure OXID-core speed differences.
  PAYMENT_BASE_BRANCH: 'b-7.4.x'
  # The shop core branch is selectable per run (in-Action build only). The apex
  # theme tracks it (themes are versioned per compilation: dev-b-7.5.x, …).
  SHOP_BRANCH: ${{ inputs.shop_branch }}
  MODULE_ID: 'oe_payments_stripe_wallet'
  # External URL when given, otherwise the in-Action shop hostname.
  SHOP_URL: ${{ inputs.url != '' && inputs.url || 'https://oxideshop.local' }}
  LOCUST_DIR: source/test-module/tests/load/locust
  # Seeded users (see the "Seed" step) — the checkout scenario logs in as these.
  LOAD_USER_PREFIX: loadtest_user_
  LOAD_USER_DOMAIN: '@oxid-esales.dev'
  LOAD_USER_COUNT: '200'
  LOAD_TEST_PASSWORD: useruser

jobs:
  load:
    name: "Locust — ${{ inputs.scenarios }} · ${{ inputs.users }} VU · ${{ inputs.duration }} · ${{ inputs.url == '' && inputs.shop_branch || 'external' }}"
    runs-on: [arc-runner-set]
    timeout-minutes: 60
    env:
      LOAD_FAIL_P95_MS: ${{ inputs.fail_p95_ms }}
      LOAD_FAIL_PCT_ERROR: ${{ inputs.fail_pct_error }}
    steps:
      # ── Build the shop (mirrors development.yml install_shop_with_module) ─────
      # Every step in this block is in-Action only; an external `url` skips them.
      - name: Cleanup workspace
        if: inputs.url == ''
        run: |
          ls -la ./
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true

      - name: Clone testing environment (docker-eshop-sdk)
        if: inputs.url == ''
        run: git clone https://github.com/OXID-eSales/docker-eshop-sdk.git .

      - name: Clone the shop
        if: inputs.url == ''
        run: git clone --depth 1 https://github.com/OXID-eSales/oxideshop_ce.git --branch ${{ env.SHOP_BRANCH }} --single-branch source

      - name: Prepare container configuration
        if: inputs.url == ''
        run: |
          make setup
          make addbasicservices
          perl -pi \
            -e 's#PHP_VERSION=.*#PHP_VERSION=${{ env.PHP_VERSION }}#g;' \
            -e "s#MYSQL_VERSION=.*#MYSQL_VERSION=${{ env.MYSQL_VERSION }}#g;" \
            .env
          perl -pi \
            -e 's#display_errors =.*#display_errors = false#g;' \
            -e 's#error_reporting = .*#error_reporting = E_ALL ^ E_WARNING ^ E_DEPRECATED#g;' \
            containers/php/custom.ini
          perl -pi \
            -e 's#/var/www/#/var/www/source/#g;' \
            containers/httpd/project.conf

      - name: Prepare shop configuration
        if: inputs.url == ''
        run: |
          cp source/source/config.inc.php.dist source/source/config.inc.php
          sed -i "1s+^+SetEnvIf Authorization \"\(.*\)\" HTTP_AUTHORIZATION=\$1\n\n+" source/source/.htaccess
          sed -i -e 's/<dbHost>/mysql/' \
                 -e 's/<dbUser>/root/' \
                 -e 's/<dbName>/example/' \
                 -e 's/<dbPwd>/root/' \
                 -e 's/<dbPort>/3306/' \
                 -e 's/<sShopURL>/https:\/\/oxideshop.local\//' \
                 -e 's/<sShopDir>/\/var\/www\/source\//' \
                 -e 's/<sCompileDir>/\/var\/www\/source\/tmp\//' \
              source/source/config.inc.php

      - name: Login to Docker Hub
        if: inputs.url == ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Start containers
        if: inputs.url == ''
        run: |
          make up
          sleep 2

      # Needed in BOTH modes — this is where the Locust files live (LOCUST_DIR).
      - name: Checkout current module
        uses: actions/checkout@v5
        with:
          path: source/test-module

      - name: Checkout payment-base (private dependency)
        if: inputs.url == ''
        uses: actions/checkout@v5
        with:
          repository: OXID-eSales/payment-base
          ref: ${{ env.PAYMENT_BASE_BRANCH }}
          path: source/payment-base
          token: ${{ secrets.ENTERPRISE_GITHUB_TOKEN || secrets.GH_TOKEN }}

      - name: Configure path repository for payment-base
        if: inputs.url == ''
        run: |
          docker compose exec -T php composer config repositories.payment-base \
            --json '{"type":"path","url":"./payment-base","options":{"symlink":true}}'

      - name: Install payment-base at shop level
        if: inputs.url == ''
        run: |
          docker compose exec -T php composer require oxid-esales/payment-base:* --no-interaction --no-update

      - name: Install module
        if: inputs.url == ''
        run: |
          docker compose exec -T php composer config repositories.${{ env.PACKAGE_NAME }} \
            --json '{"type":"path", "url":"./test-module", "options": {"symlink": true}}'
          docker compose exec -T php composer require ${{ env.PACKAGE_NAME }}:* --no-interaction --no-update

      - name: Require demodata + apex theme
        if: inputs.url == ''
        run: |
          docker compose exec -T php composer config repositories.oxid-esales/oxideshop-demodata-ce \
            --json '{"type":"git", "url":"https://github.com/OXID-eSales/oxideshop_demodata_ce"}'
          docker compose exec -T php composer require oxid-esales/oxideshop-demodata-ce:dev-master --no-update
          docker compose exec -T php composer require oxid-esales/apex-theme:dev-${{ env.SHOP_BRANCH }} --no-update

      - name: Install dependencies
        if: inputs.url == ''
        env:
          GH_TOKEN: ${{ secrets.ENTERPRISE_GITHUB_TOKEN || secrets.GH_TOKEN }}
        run: |
          docker compose exec -T -e COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"${GH_TOKEN}\"}}" \
            php composer update --with-all-dependencies --no-interaction

      # Workaround for the CI-only unified-namespace-generator backslash-dir bug
      # (see development.yml for the full explanation).
      - name: Workaround — rename backslash-named generator dirs
        if: inputs.url == ''
        run: |
          docker compose exec -T php sh -c '
            cd /var/www/vendor/oxid-esales/oxideshop-unified-namespace-generator/generated
            for src in $(find . -mindepth 1 -maxdepth 1 -type d -name "*\\\\*" | sort -r); do
              target=$(echo "${src#./}" | sed "s|\\\\|/|g")
              mkdir -p "$(dirname "$target")"
              if [ -d "$target" ]; then
                cp -rT "$src" "$target" && rm -rf "$src"
              else
                mv "$src" "$target"
              fi
            done
          '

      - name: Reset database
        if: inputs.url == ''
        run: |
          docker compose exec -T php bin/oe-console oe:database:reset \
            --db-host=mysql --db-port=3306 --db-name=example --db-user=root --db-password=root --force

      - name: Install demodata
        if: inputs.url == ''
        run: docker compose exec -T php bin/oe-console oe:setup:demodata

      - name: Activate apex theme
        if: inputs.url == ''
        run: docker compose exec -T php bin/oe-console oe:theme:activate apex

      - name: Install + activate payment-base module
        if: inputs.url == ''
        run: |
          docker compose exec -T php bin/oe-console oe:module:install /var/www/vendor/oxid-esales/payment-base
          docker compose exec -T php bin/oe-console oe:module:activate oe_payment_base

      - name: Install + activate stripe-wallet module
        if: inputs.url == ''
        run: |
          docker compose exec -T php bin/oe-console oe:module:install /var/www/test-module
          docker compose exec -T php bin/oe-console oe:module:activate ${{ env.MODULE_ID }}

      # ── Configure Stripe TEST mode + keys on the running shop (local php
      #     container — reliable, no SSH). The shop is ephemeral, so this can
      #     never touch live keys. Quoted heredoc -> no shell $ expansion. ────────
      - name: Configure Stripe test mode
        if: inputs.url == ''
        run: |
          # display_errors is off in the container, so force errors to STDERR and
          # catch Throwable -> the real cause is visible (a silent fatal = exit 255
          # with no message otherwise). Best-effort: the browse scenario needs no
          # Stripe config, so a failure here only limits the checkout scenario.
          cat > source/_loadtest_stripe_cfg.php <<'PHP'
          <?php
          ini_set('display_errors', 'stderr');
          error_reporting(E_ALL);
          require '/var/www/source/bootstrap.php';
          try {
              $c = \OxidEsales\EshopCommunity\Internal\Container\ContainerFactory::getInstance()->getContainer();
              $bridge = $c->get(\OxidEsales\EshopCommunity\Internal\Framework\Module\Configuration\Bridge\ModuleSettingBridgeInterface::class);
              $moduleId = 'oe_payments_stripe_wallet';
              $bridge->save('sStripeMode', 'test', $moduleId);
              $bridge->save('sStripeTestToken', (string) getenv('STRIPE_TEST_SECRET_KEY'), $moduleId);
              $bridge->save('sStripeTestPk', (string) getenv('STRIPE_TEST_PUBLISHABLE_KEY'), $moduleId);
              echo "stripe configured: mode=test\n";
          } catch (\Throwable $e) {
              fwrite(STDERR, 'STRIPE_CFG_ERROR: ' . get_class($e) . ': ' . $e->getMessage() . "\n");
              exit(3);
          }
          PHP
          if docker compose exec -T \
            -e STRIPE_TEST_SECRET_KEY="${{ secrets.STRIPE_TEST_SECRET_KEY }}" \
            -e STRIPE_TEST_PUBLISHABLE_KEY="${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}" \
            php php /var/www/_loadtest_stripe_cfg.php; then
            docker compose exec -T php bin/oe-console oe:cache:clear || true
          else
            echo "::warning::Stripe test-mode config failed — checkout scenario's createCheckoutSession will be limited (browse unaffected)"
          fi
          rm -f source/_loadtest_stripe_cfg.php

      - name: Seed login-able users + high stock
        if: inputs.url == ''
        run: |
          cat > source/_loadtest_seed.php <<'PHP'
          <?php
          require '/var/www/source/bootstrap.php';
          $db = \OxidEsales\Eshop\Core\DatabaseProvider::getDb();
          for ($i = 1; $i <= 200; $i++) {
              $num = str_pad((string) $i, 3, '0', STR_PAD_LEFT);
              $email = 'loadtest_user_' . $num . '@oxid-esales.dev';
              if ((int) $db->getOne('SELECT COUNT(*) FROM oxuser WHERE OXUSERNAME = ?', [$email]) > 0) {
                  continue;
              }
              $db->execute(
                  'INSERT INTO oxuser (OXID, OXACTIVE, OXUSERNAME, OXPASSWORD, OXFNAME, OXLNAME, OXSTREET, OXSTREETNR, OXZIP, OXCITY, OXCOUNTRYID, OXSAL)'
                  . ' VALUES (?, 1, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)',
                  [md5($email), $email, password_hash('useruser', PASSWORD_DEFAULT), 'Load', 'Test' . $num, 'Bertoldstr.', $num, '79098', 'Freiburg', 'a7c40f631fc920687.20179984', 'MR']
              );
          }
          $db->execute('UPDATE oxarticles SET OXSTOCK = 99999 WHERE OXACTIVE = 1 AND OXSTOCK < 99999');
          // Hand a real, buyable product OXID to the load harness — the SEO shop
          // exposes no anid= links to scrape, so discovery would otherwise be empty.
          $anid = (string) $db->getOne(
              "SELECT OXID FROM oxarticles WHERE OXACTIVE = 1 AND (OXPARENTID = '' OR OXPARENTID IS NULL) AND OXSTOCK > 0 LIMIT 1"
          );
          echo 'PRODUCT_ANID:' . $anid . "\n";
          echo "seeded users + stock\n";
          PHP
          OUT=$(docker compose exec -T php php /var/www/_loadtest_seed.php)
          echo "$OUT"
          rm -f source/_loadtest_seed.php
          ANID=$(printf '%s' "$OUT" | grep -oE 'PRODUCT_ANID:[0-9a-zA-Z._-]+' | head -1 | cut -d: -f2)
          if [ -n "$ANID" ]; then
            echo "LOAD_PRODUCT_ANID=$ANID" >> "$GITHUB_ENV"
            echo "discovered product anid: $ANID"
          fi

      # External shop: seed over SSH (mirrors load-test.yml). The checkout
      # scenario logs in as these users and needs stock; pass `product_anid`
      # for the basket (auto-discovery only works for the in-Action shop).
      - name: Seed external shop (users + high stock)
        if: inputs.url != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SHOP_HOST }}
          username: ${{ secrets.SHOP_SSH_USER }}
          key: ${{ secrets.SHOP_SSH_KEY }}
          script: |
            cd /var/www/oxid/oxid75

            # Seed 200 login-able users (idempotent — skips existing)
            make php CMD="php -r \"
              require 'source/bootstrap.php';
              \\\$db = \\OxidEsales\\Eshop\\Core\\DatabaseProvider::getDb();
              for (\\\$i = 1; \\\$i <= 200; \\\$i++) {
                \\\$num = str_pad((string) \\\$i, 3, '0', STR_PAD_LEFT);
                \\\$email = 'loadtest_user_' . \\\$num . '@oxid-esales.dev';
                if ((int) \\\$db->getOne('SELECT COUNT(*) FROM oxuser WHERE OXUSERNAME = ?', [\\\$email]) > 0) continue;
                \\\$db->execute(
                  'INSERT INTO oxuser (OXID, OXACTIVE, OXUSERNAME, OXPASSWORD, OXFNAME, OXLNAME, OXSTREET, OXSTREETNR, OXZIP, OXCITY, OXCOUNTRYID, OXSAL)
                   VALUES (?, 1, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)',
                  [md5(\\\$email), \\\$email, password_hash('useruser', PASSWORD_DEFAULT), 'Load', 'Test'.\\\$num, 'Bertoldstr.', \\\$num, '79098', 'Freiburg', 'a7c40f631fc920687.20179984', 'MR']
                );
              }
              echo 'Seeded 200 load test users';
            \""

            # Set high stock on all active products
            make php CMD="php -r \"
              require 'source/bootstrap.php';
              \\\$db = \\OxidEsales\\Eshop\\Core\\DatabaseProvider::getDb();
              \\\$db->execute('UPDATE oxarticles SET OXSTOCK = 99999 WHERE OXACTIVE = 1 AND OXSTOCK < 99999');
              echo 'Stock set to 99999 for all active products';
            \""

      # ── Make the shop reachable from the runner host + sanity-check ───────────
      - name: Map shop hostname (in-Action shop)
        if: inputs.url == ''
        run: echo "127.0.0.1 oxideshop.local" | sudo tee -a /etc/hosts

      - name: Verify shop reachable
        run: |
          for i in $(seq 1 30); do
            # -L: follow the SEO 301 from index.php?cl=start to the canonical
            # start URL; accept any 2xx/3xx as "shop is serving".
            STATUS=$(curl -skL -o /dev/null -w "%{http_code}" "${{ env.SHOP_URL }}/index.php?cl=start" || true)
            echo "attempt $i: HTTP $STATUS"
            if [ -n "$STATUS" ] && [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then exit 0; fi
            sleep 3
          done
          echo "::error::shop did not serve HTTP 2xx/3xx at ${{ env.SHOP_URL }}"
          if [ -z "${{ inputs.url }}" ]; then docker compose logs --tail 80; fi
          exit 1

      # ── Run Locust on the runner against the in-Action shop ───────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.LOCUST_DIR }}/requirements-chart.txt

      - name: Install Locust + charting deps
        working-directory: ${{ env.LOCUST_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install locust==2.31.8 pytest -r requirements-chart.txt

      # Gate the run on the charting unit tests: the chart-embed step rewrites the
      # Locust index.html, and a bad embed silently produces a blank, browser-
      # hanging report. Fail fast here instead of after a full load run.
      - name: Unit-test charting tools
        working-directory: ${{ env.LOCUST_DIR }}
        run: python -m pytest tests/test_chart_parse.py -q

      - name: Run Locust
        working-directory: ${{ env.LOCUST_DIR }}
        env:
          LOAD_INSECURE_TLS: '1'   # the in-CI shop uses a self-signed cert
          # External run: take the anid from the input. In-Action run: fall back
          # to the OXID auto-discovered during seeding (set via $GITHUB_ENV).
          LOAD_PRODUCT_ANID: ${{ inputs.product_anid != '' && inputs.product_anid || env.LOAD_PRODUCT_ANID }}
        run: |
          mkdir -p load-report
          if [ -n "${{ inputs.url }}" ] && [ -z "$LOAD_PRODUCT_ANID" ] && [ "${{ inputs.scenarios }}" != "browse" ]; then
            echo "::warning::External run without product_anid — the checkout scenario has no product to add to basket. Pass the 'product_anid' input."
          fi
          case "${{ inputs.scenarios }}" in
            browse)   CLASSES="AnonymousBrowse" ;;
            checkout) CLASSES="CheckoutFlow" ;;
            *)        CLASSES="" ;;
          esac
          set +o pipefail
          locust -f locustfile.py \
            --host "${{ env.SHOP_URL }}" \
            --headless \
            --users "${{ inputs.users }}" \
            --spawn-rate "${{ inputs.spawn_rate }}" \
            --run-time "${{ inputs.duration }}" \
            --csv load-report/stats \
            --html load-report/index.html \
            $CLASSES \
            2>&1 | tee load-report/locust-output.txt
          echo "LOCUST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Generate capacity charts (X=${{ inputs.chart_xscale }} Y=${{ inputs.chart_yscale }})
        if: always()
        continue-on-error: true
        working-directory: ${{ env.LOCUST_DIR }}
        run: |
          HIST=load-report/stats_stats_history.csv
          if [ -f "$HIST" ]; then
            python -m chart.render --history "$HIST" --out load-report/charts \
              --xscale "${{ inputs.chart_xscale }}" --yscale "${{ inputs.chart_yscale }}"
          else
            echo "no history CSV at $HIST — skipping charts"
          fi

      - name: Embed charts into Locust report
        if: always()
        continue-on-error: true
        working-directory: ${{ env.LOCUST_DIR }}
        run: |
          if [ -f load-report/index.html ] && ls load-report/charts/*.png >/dev/null 2>&1; then
            python -m chart.embed --index load-report/index.html --charts load-report/charts/*.png
          else
            echo "no index.html or charts — skipping embed"
          fi

      - name: Step summary
        if: always()
        working-directory: ${{ env.LOCUST_DIR }}
        run: |
          {
            echo "## Locust Load Test (in-Action shop)"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            if [ -z "${{ inputs.url }}" ]; then
              echo "| Shop | ${{ env.SHOP_URL }} (built in CI, Stripe test mode) |"
              echo "| OXID CE branch | ${{ inputs.shop_branch }} (apex-theme dev-${{ inputs.shop_branch }}) |"
            else
              echo "| Shop | ${{ env.SHOP_URL }} (external — assumed Stripe test mode) |"
            fi
            echo "| Scenario | ${{ inputs.scenarios }} |"
            echo "| Users | ${{ inputs.users }} (spawn ${{ inputs.spawn_rate }}/s) |"
            echo "| Duration | ${{ inputs.duration }} |"
            echo "| p95 budget | ${{ inputs.fail_p95_ms }} ms |"
            echo "| error budget | ${{ inputs.fail_pct_error }} % |"
            echo ""
            if [ -f load-report/stats_stats.csv ]; then
              echo "### Aggregated stats"; echo '```'; cat load-report/stats_stats.csv; echo '```'
            fi
            if grep -q '^BREACH ' load-report/locust-output.txt 2>/dev/null; then
              echo "### Threshold breaches"; echo '```'; grep '^BREACH ' load-report/locust-output.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report + charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-report-${{ github.run_number }}
          path: ${{ env.LOCUST_DIR }}/load-report/
          retention-days: 30

      - name: Show docker logs
        if: always() && inputs.url == ''
        run: docker compose logs --tail 200 || true

      - name: Stop containers
        if: always() && inputs.url == ''
        run: docker compose down -v || true

      - name: Fail job on threshold breach
        if: always()
        run: |
          echo "Locust exit code: ${LOCUST_EXIT:-unknown}"
          if [ "${LOCUST_EXIT:-1}" != "0" ]; then
            echo "::error::Locust signalled a threshold breach or run error (exit ${LOCUST_EXIT:-1})"
            exit 1
          fi
