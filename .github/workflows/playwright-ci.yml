name: Playwright E2E

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Shop base URL to test against (no trailing slash, e.g. https://pay1.oxid.dev)'
        required: true
        default: 'https://pay1.oxid.dev'
        type: string
      test_groups:
        description: 'Playwright projects to run, space- or comma-separated (admin-tests, checkout-tests, chromium). Leave empty to run all.'
        required: false
        default: ''
        type: string

env:
  SHOP_PATH: /var/www/oxid/oxid75
  MODULE_PATH: /var/www/oxid/oxid75/source/extensions/stripe
  PLAYWRIGHT_PATH: tests/e2e/playwright/playwright
  SHOP_HOME_URL: ${{ inputs.url }}

jobs:
  deploy:
    name: Deploy & activate module
    runs-on: [arc-runner-set]
    steps:
      - name: Checkout module on remote shop
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SHOP_HOST }}
          username: ${{ secrets.SHOP_SSH_USER }}
          key: ${{ secrets.SHOP_SSH_KEY }}
          script: |
            cd ${{ env.MODULE_PATH }}
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

      - name: Update dependencies and activate module
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SHOP_HOST }}
          username: ${{ secrets.SHOP_SSH_USER }}
          key: ${{ secrets.SHOP_SSH_KEY }}
          script: |
            cd ${{ env.SHOP_PATH }}
            make php CMD="composer update --no-interaction"
            make php CMD="bin/oe-console oe:module:deactivate oe_payments_stripe_wallet"
            make php CMD="bin/oe-console oe:module:activate oe_payments_stripe_wallet"
            make php CMD="bin/oe-console o:c:c"

  playwright:
    name: Run Playwright tests
    needs: deploy
    runs-on: [arc-runner-set]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false
          token: ${{ secrets.ENTERPRISE_GITHUB_TOKEN }}

      - name: Check out private Playwright submodule
        env:
          GH_PAT_PLAYWRIGHT: ${{ secrets.GH_PAT_PLAYWRIGHT }}
        run: |
          git submodule sync -- tests/e2e/playwright
          git -c "url.https://x-access-token:${GH_PAT_PLAYWRIGHT}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --depth=1 -- tests/e2e/playwright

      - name: Verify Playwright submodule branch
        run: |
          cd ${{ env.PLAYWRIGHT_PATH }}
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_PATH }}/node_modules
          key: playwright-node-${{ hashFiles(format('{0}/package-lock.json', env.PLAYWRIGHT_PATH)) }}

      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles(format('{0}/package-lock.json', env.PLAYWRIGHT_PATH)) }}

      - name: Install dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: ${{ env.PLAYWRIGHT_PATH }}
        run: npm ci

      - name: Install Playwright browsers
        if: steps.cache-pw.outputs.cache-hit != 'true'
        working-directory: ${{ env.PLAYWRIGHT_PATH }}
        run: npx playwright install --with-deps chromium

      - name: Create .env
        working-directory: ${{ env.PLAYWRIGHT_PATH }}
        run: |
          ls -la
          echo "shop url"
          echo ${{ env.SHOP_HOME_URL }}
          cat <<EOF > .env
          SHOP_URL=${{ env.SHOP_HOME_URL }}
          ADMIN_URL=${{ env.SHOP_HOME_URL }}/admin/
          TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}
          HEADLESS=true
          EOF

      - name: Run Playwright tests
        working-directory: ${{ env.PLAYWRIGHT_PATH }}
        env:
          CI: true
          TEST_GROUPS: ${{ inputs.test_groups }}
        run: |
          project_args=""
          for group in $(echo "$TEST_GROUPS" | tr ',' ' '); do
            project_args="$project_args --project=$group"
          done
          echo "Running: npx playwright test${project_args:- (all projects)}"
          npx playwright test $project_args

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ env.PLAYWRIGHT_PATH }}/reports/html-report/
            ${{ env.PLAYWRIGHT_PATH }}/reports/test-results/
          retention-days: 2
