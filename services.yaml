services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  OxidSolutionCatalysts\Payments\Stripe\Service\:
    resource: 'src/Stripe/Service/*'
    exclude:
      - 'src/Stripe/Service/EncryptionService.php'
      - 'src/Stripe/Service/Result/*'
      - 'src/Stripe/Service/ReconciliationResult.php'
    public: true

  # Encryption Service - Requires explicit encryption key configuration
  # The encryption key should be set via environment variable or shop configuration
  OxidSolutionCatalysts\Payments\Stripe\Service\EncryptionService:
    arguments:
      $encryptionKey: '%env(default::STRIPE_ENCRYPTION_KEY)%'
    public: true

  # ===========================================
  # Event System (Component Level)
  # ===========================================

  # Event Listener Provider - Collects all tagged handlers
  OxidSolutionCatalysts\Payments\Component\EventSystem\EventListenerProviderInterface:
    class: OxidSolutionCatalysts\Payments\Component\EventSystem\EventListenerProvider
    arguments:
      - !tagged_iterator payment.event_handler
    public: false

  # Event Dispatcher - Uses provider for listener lookup
  OxidSolutionCatalysts\Payments\Component\EventSystem\EventDispatcherInterface:
    class: OxidSolutionCatalysts\Payments\Component\EventSystem\EventDispatcher
    arguments:
      - '@OxidSolutionCatalysts\Payments\Component\EventSystem\EventListenerProviderInterface'
    public: true

  # ===========================================
  # Order Payment State Service (Sprint 16)
  # ===========================================
  # Consolidates all OXPAID/OXTRANSSTATUS/OXTRANSID updates
  # DRY: Single location for payment state operations
  # Previously duplicated in 4+ locations with inconsistent date handling

  OxidSolutionCatalysts\Payments\Component\Service\OrderPaymentStateServiceInterface:
    class: OxidSolutionCatalysts\Payments\Component\Service\OrderPaymentStateService
    arguments:
      $connection: '@doctrine.dbal.connection'
      $logger: '@oxid_esales.monolog.logger'
    public: true

  # ===========================================
  # Contract Fulfillment Service (Sprint 18)
  # ===========================================
  # Consolidates all contract fulfillment operations
  # DRY: Single location for fulfill() logic previously duplicated in 8+ locations
  # Guards: Only COMMITTED contracts can be fulfilled

  OxidSolutionCatalysts\Payments\Component\Service\ContractFulfillmentServiceInterface:
    class: OxidSolutionCatalysts\Payments\Component\Service\ContractFulfillmentService
    arguments:
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
      $eventDispatcher: '@OxidSolutionCatalysts\Payments\Component\EventSystem\EventDispatcherInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: true

  # ===========================================
  # Checkout Orchestrator (Sprint 2)
  # ===========================================

  # Checkout Orchestrator - Coordinates checkout accounting
  # Note: Does NOT call Stripe API - only backend accounting
  OxidSolutionCatalysts\Payments\Component\Service\CheckoutOrchestratorInterface:
    class: OxidSolutionCatalysts\Payments\Component\Service\CheckoutOrchestrator
    arguments:
      - '@OxidSolutionCatalysts\Payments\Component\EventSystem\EventDispatcherInterface'
      - null  # Logger - optional, can be injected if available
    public: true

  # ===========================================
  # Event Handlers (Tagged for auto-registration)
  # ===========================================
  # Note: Handlers are commented out until their dependencies
  # (ContractServiceInterface, ContractRepositoryInterface, etc.) are registered.
  # They will be enabled in Sprint 2 when the orchestrator and services are ready.

  # # Contract Creation Handler - Creates payment contracts on PaymentInitiatedEvent
  # OxidSolutionCatalysts\Payments\Component\EventSystem\Handler\ContractCreationHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # # Contract Condition Resolver Handler - Transitions contracts to PENDING state
  # OxidSolutionCatalysts\Payments\Component\EventSystem\Handler\ContractConditionResolverHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # # Contract Fulfillment Handler - Handles webhook-triggered fulfillment
  # OxidSolutionCatalysts\Payments\Component\EventSystem\Handler\ContractFulfillmentHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # # Contract Cleanup Handler - Cleans up terminated contracts
  # OxidSolutionCatalysts\Payments\Component\EventSystem\Handler\ContractCleanupHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # # Order Creation Handler - Creates orders from committed contracts
  # OxidSolutionCatalysts\Payments\Component\EventSystem\Handler\OrderCreationHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # # Payment Authorization Handler - Handles payment authorization
  # OxidSolutionCatalysts\Payments\Component\EventSystem\Handler\PaymentAuthorizationHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # ===========================================
  # Payment Adapter Layer (Provider-Agnostic)
  # ===========================================
  #
  # This layer provides a provider-agnostic payment integration architecture
  # that supports multiple payment providers (Stripe, Unzer, PayPal, etc.)
  # through a unified interface.
  #
  # Key Features:
  # - Provider-agnostic PaymentAdapterInterface
  # - Request/Response objects (no domain leakage)
  # - Two-step authorization (authorize → capture)
  # - Vaulting/tokenization (saved cards)
  # - 3D Secure/SCA support
  # - Webhook signature verification
  #
  # TODO: Integrate with StripeConfigService for API key management

  # Stripe Client Factory - Creates configured Stripe SDK clients
  # Gets API credentials from ModuleConfigurationService
  OxidSolutionCatalysts\Payments\Stripe\Adapter\StripeClientFactory:
    public: false

  # Stripe Client - Actual Stripe SDK client instance
  # Created via factory method from StripeClientFactory
  stripe.payment.adapter.client:
    class: Stripe\StripeClient
    factory: ['@OxidSolutionCatalysts\Payments\Stripe\Adapter\StripeClientFactory', 'create']
    public: false

  # Payment Adapter Factory Interface - Bind to Stripe implementation
  # This is the main entry point for getting payment adapters
  # Gets API credentials from ModuleConfigurationService
  OxidSolutionCatalysts\Payments\Component\Service\Factory\PaymentAdapterFactoryInterface:
    class: OxidSolutionCatalysts\Payments\Stripe\Service\Factory\StripeAdapterFactory
    public: true

  # Stripe Adapter Factory Interface - Stripe-specific factory
  OxidSolutionCatalysts\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface:
    alias: OxidSolutionCatalysts\Payments\Component\Service\Factory\PaymentAdapterFactoryInterface
    public: true

  # Stripe Adapter Factory - Concrete implementation
  OxidSolutionCatalysts\Payments\Stripe\Service\Factory\StripeAdapterFactory:
    alias: OxidSolutionCatalysts\Payments\Component\Service\Factory\PaymentAdapterFactoryInterface
    public: true

  # ==========================================
  # Shop Adapter Layer (Platform-Agnostic)
  # ==========================================
  #
  # Provides abstraction layer for shop-specific operations like translations,
  # configuration, session management, etc. This allows the Payment Component
  # to remain platform-agnostic while working with different shop systems
  # (OXID, Shopware, Magento, etc.)
  #
  # Key Features:
  # - Platform-agnostic ShopAdapterInterface
  # - Translation service (replaces deprecated Registry::getLang())
  # - Shop configuration access
  # - Language and currency management
  #

  # Shop Adapter Interface - Bind to OXID implementation
  OxidSolutionCatalysts\Payments\Component\Adapter\ShopAdapterInterface:
    class: OxidSolutionCatalysts\Payments\Stripe\Adapter\OxidShopAdapter
    public: false

  # OXID Shop Adapter - OXID eShop specific implementation
  OxidSolutionCatalysts\Payments\Stripe\Adapter\OxidShopAdapter:
    alias: OxidSolutionCatalysts\Payments\Component\Adapter\ShopAdapterInterface

  # ==========================================
  # Shop Order Service (Order Operations)
  # ==========================================
  #
  # Provides platform-agnostic interface for order operations.
  # Phase 1 implements order creation from basket/cart.
  #
  # Key Features:
  # - Creates orders via Order::finalizeOrder()
  # - Maps OXID order states to normalized statuses
  # - Associates payment transactions with orders
  # - Stores order metadata
  #

  # Shop Order Service Interface - Bind to OXID implementation
  OxidSolutionCatalysts\Payments\Component\Adapter\ShopOrderServiceInterface:
    class: OxidSolutionCatalysts\Payments\Stripe\Adapter\OxidShopOrderService
    public: true

  # OXID Shop Order Service - OXID eShop specific implementation
  OxidSolutionCatalysts\Payments\Stripe\Adapter\OxidShopOrderService:
    alias: OxidSolutionCatalysts\Payments\Component\Adapter\ShopOrderServiceInterface

  # ==========================================
  # Contract Repository (Data Access Layer)
  # ==========================================

  # Contract Repository Interface - Bind to Doctrine implementation
  # public: true required for integration tests to access directly
  OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface:
    class: OxidSolutionCatalysts\Payments\Component\Repository\DoctrineContractRepository
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: true

  # Contract Repository - Alias
  OxidSolutionCatalysts\Payments\Component\Repository\DoctrineContractRepository:
    alias: OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface

  # ==========================================
  # Contract Service
  # ==========================================

  # Contract Service Interface - Bind to implementation
  OxidSolutionCatalysts\Payments\Component\Service\ContractServiceInterface:
    class: OxidSolutionCatalysts\Payments\Component\Service\ContractService
    arguments:
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
    public: true

  # ==========================================
  # Token Service (Security)
  # ==========================================
  #
  # Provides secure token generation and validation for contract-based
  # payment flows. Used to prevent tampering with return URLs.
  #

  # Token Service Interface - Bind to implementation
  # Derives secret from ModuleConfigurationService (no extra env var needed)
  OxidSolutionCatalysts\Payments\Component\Service\TokenServiceInterface:
    class: OxidSolutionCatalysts\Payments\Stripe\Service\ContractTokenService
    public: false

  # Stripe Contract Token Service
  OxidSolutionCatalysts\Payments\Stripe\Service\ContractTokenService:
    alias: OxidSolutionCatalysts\Payments\Component\Service\TokenServiceInterface

  # ==========================================
  # Security Validator (Fraud Prevention)
  # ==========================================
  #
  # Validates return requests from payment providers to detect fraud.
  #

  # Security Validator Interface - Bind to implementation
  OxidSolutionCatalysts\Payments\Component\Service\ReturnSecurityValidatorInterface:
    class: OxidSolutionCatalysts\Payments\Stripe\Service\ReturnSessionSecurityService
    public: false

  # Stripe Return Security Service
  OxidSolutionCatalysts\Payments\Stripe\Service\ReturnSessionSecurityService:
    alias: OxidSolutionCatalysts\Payments\Component\Service\ReturnSecurityValidatorInterface

  # ==========================================
  # Stripe Checkout Session Handlers
  # ==========================================

  # Stripe Contract Creation Handler - Creates contract for checkout flow
  # Priority 100: Runs BEFORE StripeCheckoutSessionHandler (priority 0)
  OxidSolutionCatalysts\Payments\Stripe\EventSystem\Handler\StripeContractCreationHandler:
    arguments:
      $contractService: '@OxidSolutionCatalysts\Payments\Component\Service\ContractServiceInterface'
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
    tags:
      - { name: payment.event_handler, priority: 100 }
    public: false

  # Stripe Checkout Session Handler - Creates Stripe Checkout Session
  # Priority 0 (default): Runs AFTER StripeContractCreationHandler
  OxidSolutionCatalysts\Payments\Stripe\EventSystem\Handler\StripeCheckoutSessionHandler:
    arguments:
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
      $adapterFactory: '@OxidSolutionCatalysts\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface'
      $tokenService: '@OxidSolutionCatalysts\Payments\Component\Service\TokenServiceInterface'
    tags:
      - { name: payment.event_handler, priority: 0 }
    public: false

  # Order Payment Completed Handler - Updates OXPAID when contract is fulfilled
  # Sprint 14: Event-driven OXPAID update via ContractFulfilledEvent
  # Sprint 16: Uses OrderPaymentStateService for OXPAID updates (DRY)
  OxidSolutionCatalysts\Payments\Stripe\EventSystem\Handler\OrderPaymentCompletedHandler:
    arguments:
      $orderPaymentStateService: '@OxidSolutionCatalysts\Payments\Component\Service\OrderPaymentStateServiceInterface'
      $logger: '@oxid_esales.monolog.logger'
    tags:
      - { name: payment.event_handler, priority: 0 }
    public: false

  # ==========================================
  # Stripe Checkout Return Handlers
  # ==========================================
  # These handlers process the return flow when user comes back from Stripe.
  # Event chain: StripeCheckoutReturnEvent → PaymentAuthorizedEvent → ContractReadyToCommitEvent

  # Stripe Checkout Return Handler - Handles return from Stripe Checkout page
  # Priority 100: Entry point for checkout return flow
  # Retrieves Checkout Session, verifies payment, dispatches PaymentAuthorizedEvent
  # NOTE: EventDispatcher is fetched lazily to avoid circular dependency
  OxidSolutionCatalysts\Payments\Stripe\EventSystem\Handler\StripeCheckoutReturnHandler:
    arguments:
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
      $adapterFactory: '@OxidSolutionCatalysts\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface'
      $tokenService: '@OxidSolutionCatalysts\Payments\Component\Service\TokenServiceInterface'
      $securityValidator: '@OxidSolutionCatalysts\Payments\Component\Service\ReturnSecurityValidatorInterface'
    tags:
      - { name: payment.event_handler, priority: 100 }
    public: false

  # Payment Authorized Event Handler - Processes PaymentAuthorizedEvent
  # Priority 90: Runs after StripeCheckoutReturnHandler
  # Transitions contract to PENDING, fulfills payment_authorized condition
  # Dispatches ContractReadyToCommitEvent if all conditions met
  # NOTE: EventDispatcher is fetched lazily to avoid circular dependency
  OxidSolutionCatalysts\Payments\Component\EventSystem\Handler\PaymentAuthorizedEventHandler:
    arguments:
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
    tags:
      - { name: payment.event_handler, priority: 90 }
    public: false

  # Stripe Order Creation Handler - Creates OXID order from contract
  # Priority 80: Runs after PaymentAuthorizedEventHandler
  # Uses OxidShopOrderService for proper OXID integration
  # NOTE: EventDispatcher is fetched lazily to avoid circular dependency
  # Sprint 16: Uses OrderPaymentStateService for OXPAID updates (DRY)
  OxidSolutionCatalysts\Payments\Stripe\EventSystem\Handler\StripeOrderCreationHandler:
    arguments:
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
      $shopOrderService: '@OxidSolutionCatalysts\Payments\Component\Adapter\ShopOrderServiceInterface'
      $orderPaymentStateService: '@OxidSolutionCatalysts\Payments\Component\Service\OrderPaymentStateServiceInterface'
    tags:
      - { name: payment.event_handler, priority: 80 }
    public: false

  # ==========================================
  # Stripe Refund Handler (Sprint 4)
  # ==========================================
  # Handles StripeRefundRequestEvent from admin panel, webhook, or API.
  # Processes refunds via Stripe API and updates order/contract state.

  OxidSolutionCatalysts\Payments\Stripe\EventSystem\Handler\StripeRefundRequestHandler:
    arguments:
      $adapterFactory: '@OxidSolutionCatalysts\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface'
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
    tags:
      - { name: payment.event_handler }
    public: false

  # ==========================================
  # Webhook Contract Fulfillment Handler (Sprint 6)
  # ==========================================
  # Handles contract state transitions from webhook events.
  # Bridges Stripe webhooks to the contract state machine.

  # Interface binding
  # Sprint 18: Uses ContractFulfillmentService for DRY fulfillment
  OxidSolutionCatalysts\Payments\Stripe\Handler\WebhookContractFulfillmentHandlerInterface:
    class: OxidSolutionCatalysts\Payments\Stripe\Handler\WebhookContractFulfillmentHandler
    arguments:
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
      $contractFulfillmentService: '@OxidSolutionCatalysts\Payments\Component\Service\ContractFulfillmentServiceInterface'
    public: false

  # Concrete implementation alias
  OxidSolutionCatalysts\Payments\Stripe\Handler\WebhookContractFulfillmentHandler:
    alias: OxidSolutionCatalysts\Payments\Stripe\Handler\WebhookContractFulfillmentHandlerInterface

  # WebhookProcessingService - Now requires WebhookContractFulfillmentHandler
  # Sprint 7: Added ContractRepository for linking webhook logs to contracts
  # Sprint 16: Added OrderPaymentStateService for DRY OXPAID updates
  # Sprint 18: Added ContractFulfillmentService for DRY fulfillment
  OxidSolutionCatalysts\Payments\Stripe\Service\WebhookProcessingService:
    arguments:
      $contractFulfillmentHandler: '@OxidSolutionCatalysts\Payments\Stripe\Handler\WebhookContractFulfillmentHandlerInterface'
      $eventDispatcher: '@OxidSolutionCatalysts\Payments\Component\EventSystem\EventDispatcherInterface'
      $webhookLogRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\WebhookLogRepositoryInterface'
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
      $orderPaymentStateService: '@OxidSolutionCatalysts\Payments\Component\Service\OrderPaymentStateServiceInterface'
      $contractFulfillmentService: '@OxidSolutionCatalysts\Payments\Component\Service\ContractFulfillmentServiceInterface'
    public: true

  # ==========================================
  # Repositories (Data Access Layer)
  # ==========================================

  # Doctrine DBAL Connection - Required for repositories
  doctrine.dbal.connection:
    class: Doctrine\DBAL\Connection
    factory: ['@OxidEsales\EshopCommunity\Internal\Framework\Database\ConnectionProviderInterface', 'get']
    public: false

  # Transaction Repository - Stores payment transactions
  OxidSolutionCatalysts\Payments\Component\Repository\TransactionRepositoryInterface:
    class: OxidSolutionCatalysts\Payments\Component\Repository\DoctrineTransactionRepository
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: false

  # Alias for easier reference
  OxidSolutionCatalysts\Payments\Component\Repository\DoctrineTransactionRepository:
    alias: OxidSolutionCatalysts\Payments\Component\Repository\TransactionRepositoryInterface

  # Stripe Payment Details Repository - Stores Stripe-specific payment data
  OxidSolutionCatalysts\Payments\Stripe\Repository\StripePaymentDetailsRepository:
    public: false

  # Webhook Log Repository - Logs webhook events for auditing and idempotency
  # public: true required for integration tests to access directly
  OxidSolutionCatalysts\Payments\Component\Repository\WebhookLogRepositoryInterface:
    class: OxidSolutionCatalysts\Payments\Component\Repository\DoctrineWebhookLogRepository
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: true

  # Webhook Log Service - Sprint 7 Phase 4: Proper layering for webhook log access
  # Architecture: Controller/Service → WebhookLogService → WebhookLogRepository → Database
  OxidSolutionCatalysts\Payments\Component\Service\WebhookLogServiceInterface:
    class: OxidSolutionCatalysts\Payments\Component\Service\WebhookLogService
    arguments:
      $repository: '@OxidSolutionCatalysts\Payments\Component\Repository\WebhookLogRepositoryInterface'
      $logger: '@Psr\Log\LoggerInterface'
    public: true

  # Payment Order State Repository - DEPRECATED (No longer used)
  # Sprint 8: PaymentOrderStateRepository DELETED
  # Payment state now tracked via osc_payment_contract with capture/refund fields.
  # osc_payment_order_state table has been dropped.

  # ==========================================
  # Twig Extensions
  # ==========================================

  # Dump Extension - Provides dump() and dd() functions for debugging templates
  OxidSolutionCatalysts\Payments\Stripe\Twig\DumpExtension:
    tags:
      - { name: twig.extension }
    public: false

  # ==========================================
  # Controllers
  # ==========================================

  # PaymentController - Extended OXID PaymentController with Stripe payment integration
  OxidSolutionCatalysts\Payments\Stripe\Controller\PaymentController:
    tags:
      - { name: oxid.view_controller, controller_key: payment }
    public: true

  # StripeOrderController - Extended OXID OrderController with Stripe payment integration
  OxidSolutionCatalysts\Payments\Stripe\Controller\StripeOrderController:
    tags:
      - { name: oxid.view_controller, controller_key: order }
    public: true

  # ==========================================
  # Webhook Handlers (Sprint 13)
  # ==========================================

  # PaymentIntentSucceededHandler - Handles payment_intent.succeeded webhooks
  # Sprint 16: Uses OrderPaymentStateService for OXPAID updates (DRY)
  # Sprint 18: Uses ContractFulfillmentService for DRY fulfillment
  OxidSolutionCatalysts\Payments\Stripe\Webhook\Handler\PaymentIntentSucceededHandler:
    arguments:
      $orderPaymentStateService: '@OxidSolutionCatalysts\Payments\Component\Service\OrderPaymentStateServiceInterface'
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
      $contractFulfillmentService: '@OxidSolutionCatalysts\Payments\Component\Service\ContractFulfillmentServiceInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: false

  # ==========================================
  # OXPAID Reconciliation (Sprint 10)
  # ==========================================
  # Service and console command for reconciling OXPAID with Stripe API.
  # Handles cases where webhooks were missed or delayed.

  # Reconciliation File Logger Factory - Creates logger with correct shop path
  # Sprint 14: Factory approach for OXID compatibility (no kernel.project_dir)
  OxidSolutionCatalysts\Payments\Stripe\Service\Factory\ReconciliationFileLoggerFactory:
    public: false

  # Reconciliation File Logger - Writes to log/osc/stripe_reconciliation.log
  # Sprint 14: Injected logger for testability (prevents unit tests writing to production logs)
  stripe.reconciliation.file_logger:
    class: OxidSolutionCatalysts\Payments\Component\Service\FileLoggerInterface
    factory: ['@OxidSolutionCatalysts\Payments\Stripe\Service\Factory\ReconciliationFileLoggerFactory', 'create']
    public: false

  # Reconciliation Service
  # Sprint 18: Uses ContractFulfillmentService for DRY fulfillment
  OxidSolutionCatalysts\Payments\Stripe\Service\OxpaidReconciliationService:
    arguments:
      $connection: '@doctrine.dbal.connection'
      $adapterFactory: '@OxidSolutionCatalysts\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface'
      $contractRepository: '@OxidSolutionCatalysts\Payments\Component\Repository\ContractRepositoryInterface'
      $contractFulfillmentService: '@OxidSolutionCatalysts\Payments\Component\Service\ContractFulfillmentServiceInterface'
      $fileLogger: '@stripe.reconciliation.file_logger'
    public: true

  # Console Command: stripe:reconcile-oxpaid
  OxidSolutionCatalysts\Payments\Stripe\Command\ReconcileOxpaidCommand:
    arguments:
      $reconciliationService: '@OxidSolutionCatalysts\Payments\Stripe\Service\OxpaidReconciliationService'
    tags:
      - { name: 'console.command', command: 'stripe:reconcile-oxpaid' }
    public: true
