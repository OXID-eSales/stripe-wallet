services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  OxidEsales\Payments\Stripe\Service\:
    resource: 'src/Stripe/Service/*'
    exclude:
      - 'src/Stripe/Service/EncryptionService.php'
      - 'src/Stripe/Service/Result/*'
      - 'src/Stripe/Service/ReconciliationResult.php'
    public: true

  # Encryption Service - Requires explicit encryption key configuration
  # The encryption key should be set via environment variable or shop configuration
  OxidEsales\Payments\Stripe\Service\EncryptionService:
    arguments:
      $encryptionKey: '%env(default::STRIPE_ENCRYPTION_KEY)%'
    public: true

  # ===========================================
  # Event System (Component Level)
  # ===========================================

  # Event Listener Provider - Collects all tagged handlers
  # Sprint 11: public: true for debugging/verification purposes
  OxidEsales\PaymentComponent\EventSystem\EventListenerProviderInterface:
    class: OxidEsales\PaymentComponent\EventSystem\EventListenerProvider
    arguments:
      - !tagged_iterator payment.event_handler
    public: true

  # Event Dispatcher - Uses provider for listener lookup
  OxidEsales\PaymentComponent\EventSystem\EventDispatcherInterface:
    class: OxidEsales\PaymentComponent\EventSystem\EventDispatcher
    arguments:
      - '@OxidEsales\PaymentComponent\EventSystem\EventListenerProviderInterface'
    public: true

  # ===========================================
  # Order Payment State Service (Sprint 16)
  # ===========================================
  # Consolidates all OXPAID/OXTRANSSTATUS/OXTRANSID updates
  # DRY: Single location for payment state operations
  # Previously duplicated in 4+ locations with inconsistent date handling

  OxidEsales\PaymentComponent\Service\OrderPaymentStateServiceInterface:
    class: OxidEsales\PaymentComponent\Service\OrderPaymentStateService
    arguments:
      $connection: '@doctrine.dbal.connection'
      $logger: '@oxid_esales.monolog.logger'
    public: true

  # ===========================================
  # Contract Fulfillment Service (Sprint 18)
  # ===========================================
  # Consolidates all contract fulfillment operations
  # DRY: Single location for fulfill() logic previously duplicated in 8+ locations
  # Guards: Only COMMITTED contracts can be fulfilled

  OxidEsales\PaymentComponent\Service\ContractFulfillmentServiceInterface:
    class: OxidEsales\PaymentComponent\Service\ContractFulfillmentService
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $eventDispatcher: '@OxidEsales\PaymentComponent\EventSystem\EventDispatcherInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: true

  # ===========================================
  # Event Handlers (Tagged for auto-registration)
  # ===========================================
  # Note: Handlers are commented out until their dependencies
  # (ContractServiceInterface, ContractRepositoryInterface, etc.) are registered.
  # They will be enabled in Sprint 2 when the orchestrator and services are ready.

  # # Contract Creation Handler - Creates payment contracts on PaymentInitiatedEvent
  # OxidEsales\PaymentComponent\EventSystem\Handler\ContractCreationHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # # Contract Condition Resolver Handler - Transitions contracts to PENDING state
  # OxidEsales\PaymentComponent\EventSystem\Handler\ContractConditionResolverHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # # Contract Fulfillment Handler - Handles webhook-triggered fulfillment
  # OxidEsales\PaymentComponent\EventSystem\Handler\ContractFulfillmentHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # # Contract Cleanup Handler - Cleans up terminated contracts
  # OxidEsales\PaymentComponent\EventSystem\Handler\ContractCleanupHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # # Order Creation Handler - Creates orders from committed contracts
  # OxidEsales\PaymentComponent\EventSystem\Handler\OrderCreationHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # # Payment Authorization Handler - Handles payment authorization
  # OxidEsales\PaymentComponent\EventSystem\Handler\PaymentAuthorizationHandler:
  #   tags:
  #     - { name: payment.event_handler }
  #   public: false

  # ==========================================
  # Early Order Creation Handler (Sprint STRP-74)
  # ==========================================
  # Handles ContractDraftCompletedEvent to create order early in the flow.
  # New flow: DRAFT -> NOT_FINISHED (order created here) -> PENDING
  # Priority 100: Runs early to ensure order is created before other handlers.

  OxidEsales\PaymentComponent\EventSystem\Handler\EarlyOrderCreationHandler:
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $shopOrderService: '@OxidEsales\PaymentComponent\Adapter\ShopOrderServiceInterface'
      $eventDispatcher: '@OxidEsales\PaymentComponent\EventSystem\EventDispatcherInterface'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler, priority: 100 }
    public: false

  # ===========================================
  # Payment Adapter Layer (Provider-Agnostic)
  # ===========================================
  #
  # This layer provides a provider-agnostic payment integration architecture
  # that supports multiple payment providers (Stripe, Unzer, PayPal, etc.)
  # through a unified interface.
  #
  # Key Features:
  # - Provider-agnostic PaymentAdapterInterface
  # - Request/Response objects (no domain leakage)
  # - Two-step authorization (authorize → capture)
  # - Vaulting/tokenization (saved cards)
  # - 3D Secure/SCA support
  # - Webhook signature verification
  #
  # TODO: Integrate with StripeConfigService for API key management

  # Stripe Client Factory - Creates configured Stripe SDK clients
  # Gets API credentials from ModuleConfigurationService
  OxidEsales\Payments\Stripe\Adapter\StripeClientFactory:
    public: false

  # Stripe Client - Actual Stripe SDK client instance
  # Created via factory method from StripeClientFactory
  stripe.payment.adapter.client:
    class: Stripe\StripeClient
    factory: ['@OxidEsales\Payments\Stripe\Adapter\StripeClientFactory', 'create']
    public: false

  # Payment Adapter Factory Interface - Bind to Stripe implementation
  # This is the main entry point for getting payment adapters
  # Gets API credentials from ModuleConfigurationService
  OxidEsales\PaymentComponent\Service\Factory\PaymentAdapterFactoryInterface:
    class: OxidEsales\Payments\Stripe\Service\Factory\StripeAdapterFactory
    public: true

  # Stripe Adapter Factory Interface - Stripe-specific factory
  OxidEsales\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface:
    alias: OxidEsales\PaymentComponent\Service\Factory\PaymentAdapterFactoryInterface
    public: true

  # Stripe Adapter Factory - Concrete implementation
  OxidEsales\Payments\Stripe\Service\Factory\StripeAdapterFactory:
    alias: OxidEsales\PaymentComponent\Service\Factory\PaymentAdapterFactoryInterface
    public: true

  # Stripe Adapter Interface - Created via factory
  # Used by handlers that need direct adapter access (capture, cancel authorization)
  OxidEsales\Payments\Stripe\Adapter\StripeAdapterInterface:
    factory: ['@OxidEsales\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface', 'getStripeAdapter']
    public: false

  # ==========================================
  # Shop Adapter Layer (Platform-Agnostic)
  # ==========================================
  #
  # Provides abstraction layer for shop-specific operations like translations,
  # configuration, session management, etc. This allows the Payment Component
  # to remain platform-agnostic while working with different shop systems
  # (OXID, Shopware, Magento, etc.)
  #
  # Key Features:
  # - Platform-agnostic ShopAdapterInterface
  # - Translation service (replaces deprecated Registry::getLang())
  # - Shop configuration access
  # - Language and currency management
  #

  # Shop Adapter Interface - Bind to OXID implementation
  OxidEsales\PaymentComponent\Adapter\ShopAdapterInterface:
    class: OxidEsales\Payments\Stripe\Adapter\OxidShopAdapter
    public: false

  # OXID Shop Adapter - OXID eShop specific implementation
  OxidEsales\Payments\Stripe\Adapter\OxidShopAdapter:
    alias: OxidEsales\PaymentComponent\Adapter\ShopAdapterInterface

  # Session Adapter Interface - Sprint 20: Abstracts session access for unit testing
  OxidEsales\Payments\Stripe\Adapter\SessionAdapterInterface:
    class: OxidEsales\Payments\Stripe\Adapter\OxidSessionAdapter
    public: false

  # OXID Session Adapter - OXID eShop specific implementation
  OxidEsales\Payments\Stripe\Adapter\OxidSessionAdapter:
    alias: OxidEsales\Payments\Stripe\Adapter\SessionAdapterInterface

  # ==========================================
  # Shop Order Service (Order Operations)
  # ==========================================
  #
  # Provides platform-agnostic interface for order operations.
  # Phase 1 implements order creation from basket/cart.
  #
  # Key Features:
  # - Creates orders via Order::finalizeOrder()
  # - Maps OXID order states to normalized statuses
  # - Associates payment transactions with orders
  # - Stores order metadata
  #

  # Shop Order Service Interface - Bind to OXID implementation
  OxidEsales\PaymentComponent\Adapter\ShopOrderServiceInterface:
    class: OxidEsales\Payments\Stripe\Adapter\OxidShopOrderService
    public: true

  # OXID Shop Order Service - OXID eShop specific implementation
  OxidEsales\Payments\Stripe\Adapter\OxidShopOrderService:
    alias: OxidEsales\PaymentComponent\Adapter\ShopOrderServiceInterface

  # ==========================================
  # Contract Repository (Data Access Layer)
  # ==========================================

  # Contract Repository Interface - Bind to Doctrine implementation
  # public: true required for integration tests to access directly
  OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface:
    class: OxidEsales\PaymentComponent\Repository\DoctrineContractRepository
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: true

  # Contract Repository - Alias
  OxidEsales\PaymentComponent\Repository\DoctrineContractRepository:
    alias: OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface

  # ==========================================
  # Contract Service
  # ==========================================

  # Contract Service Interface - Bind to implementation
  OxidEsales\PaymentComponent\Service\ContractServiceInterface:
    class: OxidEsales\PaymentComponent\Service\ContractService
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
    public: true

  # ==========================================
  # Token Service (Security)
  # ==========================================
  #
  # Provides secure token generation and validation for contract-based
  # payment flows. Used to prevent tampering with return URLs.
  #

  # Token Service Interface - Bind to implementation
  # Derives secret from ModuleConfigurationService (no extra env var needed)
  OxidEsales\PaymentComponent\Service\TokenServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\ContractTokenService
    public: false

  # Stripe Contract Token Service
  OxidEsales\Payments\Stripe\Service\ContractTokenService:
    alias: OxidEsales\PaymentComponent\Service\TokenServiceInterface

  # ==========================================
  # Security Validator (Fraud Prevention)
  # ==========================================
  #
  # Validates return requests from payment providers to detect fraud.
  #

  # Security Validator Interface - Bind to implementation
  OxidEsales\PaymentComponent\Service\ReturnSecurityValidatorInterface:
    class: OxidEsales\Payments\Stripe\Service\ReturnSessionSecurityService
    public: false

  # Stripe Return Security Service
  OxidEsales\Payments\Stripe\Service\ReturnSessionSecurityService:
    alias: OxidEsales\PaymentComponent\Service\ReturnSecurityValidatorInterface

  # ==========================================
  # Delivery Address Hash Service (Sprint 20)
  # ==========================================
  # Encapsulates $_REQUEST modification for OXID's delivery address validation.
  # OXID reads from $_REQUEST['sDeliveryAddressMD5'] which requires this anti-pattern.

  OxidEsales\Payments\Stripe\Service\DeliveryAddressHashServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\DeliveryAddressHashService
    public: false

  # ==========================================
  # Stripe Checkout Session Service (Sprint 21)
  # ==========================================
  # Extracted business logic from StripeCheckoutSessionHandler.
  # SRP: Service handles checkout session creation logic.

  OxidEsales\Payments\Stripe\Service\CheckoutSessionServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\CheckoutSessionService
    arguments:
      $adapterFactory: '@OxidEsales\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: false

  # ==========================================
  # Contract Metadata Service (Sprint 21)
  # ==========================================
  # Extracted business logic from StripeContractCreationHandler.
  # SRP: Service handles contract metadata operations.

  OxidEsales\Payments\Stripe\Service\ContractMetadataServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\ContractMetadataService
    public: false

  # ==========================================
  # Stripe Checkout Session Handlers
  # ==========================================

  # Stripe Contract Creation Handler - Creates contract for checkout flow
  # Priority 100: Runs BEFORE StripeCheckoutSessionHandler (priority 0)
  # Sprint 21: Refactored to delegate metadata to ContractMetadataService
  # Sprint 25: Added event logger for debugging
  OxidEsales\Payments\Stripe\EventSystem\Handler\StripeContractCreationHandler:
    arguments:
      $contractService: '@OxidEsales\PaymentComponent\Service\ContractServiceInterface'
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $metadataService: '@OxidEsales\Payments\Stripe\Service\ContractMetadataServiceInterface'
      $eventDispatcher: '@OxidEsales\PaymentComponent\EventSystem\EventDispatcherInterface'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler, priority: 100 }
    public: false

  # Stripe Checkout Session Handler - Creates Stripe Checkout Session
  # Priority 0 (default): Runs AFTER StripeContractCreationHandler
  # Sprint 21: Refactored to delegate to CheckoutSessionService (SRP)
  # Sprint 25: Added event logger for debugging
  OxidEsales\Payments\Stripe\EventSystem\Handler\StripeCheckoutSessionHandler:
    arguments:
      $checkoutSessionService: '@OxidEsales\Payments\Stripe\Service\CheckoutSessionServiceInterface'
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $tokenService: '@OxidEsales\PaymentComponent\Service\TokenServiceInterface'
      $shopAdapter: '@OxidEsales\PaymentComponent\Adapter\ShopAdapterInterface'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler, priority: 0 }
    public: false

  # Order Payment Completed Handler - Updates OXPAID when contract is fulfilled
  # Sprint 14: Event-driven OXPAID update via ContractFulfilledEvent
  # Sprint 16: Uses OrderPaymentStateService for OXPAID updates (DRY)
  # Sprint 25: Added event logger for debugging
  OxidEsales\Payments\Stripe\EventSystem\Handler\OrderPaymentCompletedHandler:
    arguments:
      $orderPaymentStateService: '@OxidEsales\PaymentComponent\Service\OrderPaymentStateServiceInterface'
      $logger: '@oxid_esales.monolog.logger'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler, priority: 0 }
    public: false

  # ==========================================
  # Stripe Checkout Return Service (Sprint 21)
  # ==========================================
  # Extracted business logic from StripeCheckoutReturnHandler.
  # SRP: Service handles checkout return validation logic.

  OxidEsales\Payments\Stripe\Service\CheckoutReturnServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\CheckoutReturnService
    arguments:
      $adapterFactory: '@OxidEsales\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface'
      $tokenService: '@OxidEsales\PaymentComponent\Service\TokenServiceInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: false

  # ==========================================
  # Stripe Checkout Return Handlers
  # ==========================================
  # These handlers process the return flow when user comes back from Stripe.
  # Event chain: StripeCheckoutReturnEvent → PaymentAuthorizedEvent → ContractReadyToCommitEvent

  # Stripe Checkout Return Handler - Handles return from Stripe Checkout page
  # Priority 100: Entry point for checkout return flow
  # Sprint 21: Refactored to delegate validation to CheckoutReturnService (SRP)
  # Sprint 22: EventDispatcher now injected via constructor (no ContainerFactory)
  OxidEsales\Payments\Stripe\EventSystem\Handler\StripeCheckoutReturnHandler:
    arguments:
      $checkoutReturnService: '@OxidEsales\Payments\Stripe\Service\CheckoutReturnServiceInterface'
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $securityValidator: '@OxidEsales\PaymentComponent\Service\ReturnSecurityValidatorInterface'
      $deliveryAddressHashService: '@OxidEsales\Payments\Stripe\Service\DeliveryAddressHashServiceInterface'
      $eventDispatcher: '@OxidEsales\PaymentComponent\EventSystem\EventDispatcherInterface'
      $sessionAdapter: '@OxidEsales\Payments\Stripe\Adapter\SessionAdapterInterface'
      $logger: '@oxid_esales.monolog.logger'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler, priority: 100 }
    public: false

  # Payment Authorized Event Handler - Processes PaymentAuthorizedEvent
  # Priority 90: Runs after StripeCheckoutReturnHandler
  # Transitions contract to PENDING, fulfills payment_authorized condition
  # Dispatches ContractReadyToCommitEvent if all conditions met
  # Sprint 22: EventDispatcher now injected via constructor (no ContainerFactory)
  OxidEsales\PaymentComponent\EventSystem\Handler\PaymentAuthorizedEventHandler:
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $eventDispatcher: '@OxidEsales\PaymentComponent\EventSystem\EventDispatcherInterface'
      $orderPaymentStateService: '@OxidEsales\PaymentComponent\Service\OrderPaymentStateServiceInterface'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler, priority: 90 }
    public: false

  # Stripe Order Creation Handler - Creates OXID order from contract
  # Priority 80: Runs after PaymentAuthorizedEventHandler
  # Uses OxidShopOrderService for proper OXID integration
  # Sprint 16: Uses OrderPaymentStateService for OXPAID updates (DRY)
  # Sprint 22: EventDispatcher now injected via constructor (no ContainerFactory)
  OxidEsales\Payments\Stripe\EventSystem\Handler\StripeOrderCreationHandler:
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $shopOrderService: '@OxidEsales\PaymentComponent\Adapter\ShopOrderServiceInterface'
      $orderPaymentStateService: '@OxidEsales\PaymentComponent\Service\OrderPaymentStateServiceInterface'
      $eventDispatcher: '@OxidEsales\PaymentComponent\EventSystem\EventDispatcherInterface'
      $sessionAdapter: '@OxidEsales\Payments\Stripe\Adapter\SessionAdapterInterface'
      $logger: '@oxid_esales.monolog.logger'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler, priority: 80 }
    public: false

  # Stripe Capture Request Handler - Handles manual capture requests
  # Sprint 8: Added RequestLogService for centralized logging
  # Sprint 9: Now delegates to CaptureService for capture execution
  # Sprint 25: Added event logger for debugging
  OxidEsales\Payments\Stripe\EventSystem\Handler\StripeCaptureRequestHandler:
    arguments:
      $captureService: '@OxidEsales\Payments\Stripe\Service\CaptureServiceInterface'
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $requestLogService: '@OxidEsales\Payments\Stripe\Service\RequestLogServiceInterface'
      $shopAdapter: '@OxidEsales\PaymentComponent\Adapter\ShopAdapterInterface'
      $logger: '@oxid_esales.monolog.logger'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler }
    public: false

  # Stripe Cancel Authorization Request Handler - Handles cancel authorization for manual capture
  # Sprint 8: Added RequestLogService for centralized logging
  # Sprint 11: Now delegates to CancelAuthorizationService (SRP)
  # Sprint 25: STRP-75 - Cancel authorization feature
  OxidEsales\Payments\Stripe\EventSystem\Handler\StripeCancelAuthorizationRequestHandler:
    arguments:
      $cancelService: '@OxidEsales\Payments\Stripe\Service\CancelAuthorizationServiceInterface'
      $requestLogService: '@OxidEsales\Payments\Stripe\Service\RequestLogServiceInterface'
      $shopAdapter: '@OxidEsales\PaymentComponent\Adapter\ShopAdapterInterface'
      $logger: '@oxid_esales.monolog.logger'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler }
    public: false

  # Stripe Payment Return Handler - Handles return from Payment Element flow
  # Sprint 25: Added event logger for debugging
  OxidEsales\Payments\Stripe\EventSystem\Handler\StripePaymentReturnHandler:
    arguments:
      $eventDispatcher: '@OxidEsales\PaymentComponent\EventSystem\EventDispatcherInterface'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler }
    public: false

  # Stripe Payment Status Handler - Verifies payment status for Payment Element flow
  # Sprint 25: Added event logger for debugging
  OxidEsales\Payments\Stripe\EventSystem\Handler\StripePaymentStatusHandler:
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $adapterFactory: '@OxidEsales\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface'
      $eventDispatcher: '@OxidEsales\PaymentComponent\EventSystem\EventDispatcherInterface'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler }
    public: false

  # ==========================================
  # Request Log Service (Sprint 8, refactored Sprint 15)
  # ==========================================
  # Sprint 15: Refactored to use file-based logging instead of database.
  # Logs to log/osc/stripe_requests.log

  # Request file logger factory
  OxidEsales\Payments\Stripe\Service\Factory\RequestFileLoggerFactory: ~

  # Request file logger instance (created by factory)
  stripe.request_file_logger:
    class: OxidEsales\PaymentComponent\Service\FileLoggerInterface
    factory: ['@OxidEsales\Payments\Stripe\Service\Factory\RequestFileLoggerFactory', 'create']

  OxidEsales\Payments\Stripe\Service\RequestLogServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\RequestLogService
    arguments:
      $fileLogger: '@stripe.request_file_logger'
      $fallbackLogger: '@oxid_esales.monolog.logger'
    public: false

  # ==========================================
  # Webhook Log Service (Sprint 16)
  # ==========================================
  # Sprint 16: Extracted from WebhookController for SRP compliance.
  # Logs to log/osc/stripe_webhooks.log

  # Webhook file logger factory
  OxidEsales\Payments\Stripe\Service\Factory\WebhookFileLoggerFactory: ~

  # Webhook file logger instance (created by factory)
  stripe.webhook_file_logger:
    class: OxidEsales\PaymentComponent\Service\FileLoggerInterface
    factory: ['@OxidEsales\Payments\Stripe\Service\Factory\WebhookFileLoggerFactory', 'create']

  OxidEsales\Payments\Stripe\Service\WebhookLogServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\WebhookLogService
    arguments:
      $fileLogger: '@stripe.webhook_file_logger'
    public: false

  # ==========================================
  # Capture Service (Sprint 9)
  # ==========================================
  # Extracted capture business logic from StripeCaptureRequestHandler.
  # Handles both contract-based and direct captures.
  # SRP: Service handles capture execution and contract state transition.

  OxidEsales\Payments\Stripe\Service\CaptureServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\CaptureService
    arguments:
      $stripeAdapter: '@OxidEsales\Payments\Stripe\Adapter\StripeAdapterInterface'
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: false

  # ==========================================
  # Cancel Authorization Service (Sprint 11)
  # ==========================================
  # Extracted cancel authorization logic from StripeCancelAuthorizationRequestHandler.
  # SRP: Service handles PaymentIntent cancellation.

  OxidEsales\Payments\Stripe\Service\CancelAuthorizationServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\CancelAuthorizationService
    arguments:
      $stripeAdapter: '@OxidEsales\Payments\Stripe\Adapter\StripeAdapterInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: false

  # ==========================================
  # Stripe Refund Service (Sprint 21)
  # ==========================================
  # Extracted business logic from StripeRefundRequestHandler.
  # SRP: Service handles all refund processing logic.

  OxidEsales\Payments\Stripe\Service\RefundServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\RefundService
    arguments:
      $adapterFactory: '@OxidEsales\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: false

  # ==========================================
  # Order Refund Update Service (Sprint 10)
  # ==========================================
  # Extracted order field updates from StripeRefundRequestHandler.
  # SRP: Service handles order field updates after full refund.

  OxidEsales\Payments\Stripe\Service\OrderRefundUpdateServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\OrderRefundUpdateService
    arguments:
      $logger: '@oxid_esales.monolog.logger'
    public: false

  # ==========================================
  # Contract-Based Capture/Refund Services (Sprint 3)
  # ==========================================
  # These services extend AbstractPaymentCaptureService and AbstractPaymentRefundService
  # from payment-component, providing Stripe-specific behavior via Template Method pattern.
  #
  # StripeCaptureService:
  # - Validates AUTHORIZED state (not COMMITTED)
  # - Calls captureAuthorization() after capture
  #
  # StripeRefundService:
  # - Uses contract-based refund approach (per Q&A decision Q6)
  # - Validates FULFILLED state before refund

  OxidEsales\Payments\Stripe\Service\StripeCaptureService:
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $paymentAdapter: '@OxidEsales\Payments\Stripe\Adapter\StripeAdapterInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: true

  OxidEsales\Payments\Stripe\Service\StripeRefundService:
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $transactionRepository: '@OxidEsales\PaymentComponent\Repository\TransactionRepositoryInterface'
      $paymentAdapter: '@OxidEsales\Payments\Stripe\Adapter\StripeAdapterInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: true

  # ==========================================
  # Stripe Refund Handler (Sprint 4, Refactored Sprint 21)
  # ==========================================
  # Handles StripeRefundRequestEvent from admin panel, webhook, or API.
  # Sprint 8: Added RequestLogService for centralized logging
  # Sprint 10: Delegates order updates to OrderRefundUpdateService (SRP).
  # Sprint 21: Delegates to RefundService for business logic (SRP).
  # Sprint 25: Added event logger for debugging

  OxidEsales\Payments\Stripe\EventSystem\Handler\StripeRefundRequestHandler:
    arguments:
      $refundService: '@OxidEsales\Payments\Stripe\Service\RefundServiceInterface'
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $orderRefundUpdateService: '@OxidEsales\Payments\Stripe\Service\OrderRefundUpdateServiceInterface'
      $requestLogService: '@OxidEsales\Payments\Stripe\Service\RequestLogServiceInterface'
      $shopAdapter: '@OxidEsales\PaymentComponent\Adapter\ShopAdapterInterface'
      $logger: '@oxid_esales.monolog.logger'
      $eventLogger: '@stripe.events.file_logger'
    tags:
      - { name: payment.event_handler }
    public: false

  # ==========================================
  # Webhook Contract Fulfillment Handler (Sprint 6)
  # ==========================================
  # Handles contract state transitions from webhook events.
  # Bridges Stripe webhooks to the contract state machine.

  # Interface binding
  # Sprint 18: Uses ContractFulfillmentService for DRY fulfillment
  OxidEsales\Payments\Stripe\WebhookHandler\WebhookContractFulfillmentHandlerInterface:
    class: OxidEsales\Payments\Stripe\WebhookHandler\WebhookContractFulfillmentHandler
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $contractFulfillmentService: '@OxidEsales\PaymentComponent\Service\ContractFulfillmentServiceInterface'
    public: false

  # Concrete implementation alias
  OxidEsales\Payments\Stripe\WebhookHandler\WebhookContractFulfillmentHandler:
    alias: OxidEsales\Payments\Stripe\WebhookHandler\WebhookContractFulfillmentHandlerInterface

  # WebhookProcessingService - DEPRECATED (Sprint 5)
  # Kept for backwards compatibility. Use StripeWebhookProcessor instead.
  # TODO: Remove in next major version
  OxidEsales\Payments\Stripe\Service\WebhookProcessingService:
    arguments:
      $contractFulfillmentHandler: '@OxidEsales\Payments\Stripe\WebhookHandler\WebhookContractFulfillmentHandlerInterface'
      $eventDispatcher: '@OxidEsales\PaymentComponent\EventSystem\EventDispatcherInterface'
      $webhookLogRepository: '@OxidEsales\PaymentComponent\Repository\WebhookLogRepositoryInterface'
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $orderPaymentStateService: '@OxidEsales\PaymentComponent\Service\OrderPaymentStateServiceInterface'
      $contractFulfillmentService: '@OxidEsales\PaymentComponent\Service\ContractFulfillmentServiceInterface'
    public: true
    deprecated:
      package: 'oxid-esales/stripe-payment'
      version: '1.0.0'
      message: 'The "%service_id%" service is deprecated. Use StripeWebhookProcessor instead.'

  # ==========================================
  # Stripe Webhook Processor (Sprint 5)
  # ==========================================
  # New webhook processor using Template Method pattern from payment-component.
  # Consolidates: signature verification, idempotency, logging, event routing.
  # Replaces WebhookProcessingService.

  OxidEsales\Payments\Stripe\Webhook\StripeWebhookProcessor:
    arguments:
      $logRepository: '@OxidEsales\PaymentComponent\Repository\WebhookLogRepositoryInterface'
      $logger: '@oxid_esales.monolog.logger'
      $config: '@OxidEsales\Payments\Stripe\Service\ModuleConfigurationService'
      $fulfillmentHandler: '@OxidEsales\Payments\Stripe\WebhookHandler\WebhookContractFulfillmentHandlerInterface'
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
    public: true

  # ==========================================
  # Repositories (Data Access Layer)
  # ==========================================

  # Doctrine DBAL Connection - Required for repositories
  doctrine.dbal.connection:
    class: Doctrine\DBAL\Connection
    factory: ['@OxidEsales\EshopCommunity\Internal\Framework\Database\ConnectionProviderInterface', 'get']
    public: false

  # Transaction Repository - Stores payment transactions
  OxidEsales\PaymentComponent\Repository\TransactionRepositoryInterface:
    class: OxidEsales\PaymentComponent\Repository\DoctrineTransactionRepository
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: false

  # Alias for easier reference
  OxidEsales\PaymentComponent\Repository\DoctrineTransactionRepository:
    alias: OxidEsales\PaymentComponent\Repository\TransactionRepositoryInterface

  # Note: StripePaymentDetailsRepository DELETED
  # Stripe-specific payment details (card info, 3DS, risk) stored in:
  # - Contract metadata (oe_payments_contract.OXPROVIDERDATA)
  # - Transaction entity (oe_payments_transaction)

  # Webhook Log Repository - Logs webhook events for auditing and idempotency
  # public: true required for integration tests to access directly
  OxidEsales\PaymentComponent\Repository\WebhookLogRepositoryInterface:
    class: OxidEsales\PaymentComponent\Repository\DoctrineWebhookLogRepository
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: true

  # Webhook Log Service - Sprint 7 Phase 4: Proper layering for webhook log access
  # Architecture: Controller/Service → WebhookLogService → WebhookLogRepository → Database
  OxidEsales\PaymentComponent\Service\WebhookLogServiceInterface:
    class: OxidEsales\PaymentComponent\Service\WebhookLogService
    arguments:
      $repository: '@OxidEsales\PaymentComponent\Repository\WebhookLogRepositoryInterface'
      $logger: '@Psr\Log\LoggerInterface'
    public: true

  # Payment Order State Repository - DEPRECATED (No longer used)
  # Sprint 8: PaymentOrderStateRepository DELETED
  # Payment state now tracked via osc_payment_contract with capture/refund fields.
  # osc_payment_order_state table has been dropped.

  # ==========================================
  # Twig Extensions
  # ==========================================

  # Dump Extension - Provides dump() and dd() functions for debugging templates
  OxidEsales\Payments\Stripe\Twig\DumpExtension:
    tags:
      - { name: twig.extension }
    public: false

  # ==========================================
  # Controllers
  # ==========================================

  # PaymentController - Extended OXID PaymentController with Stripe payment integration
  OxidEsales\Payments\Stripe\Controller\PaymentController:
    tags:
      - { name: oxid.view_controller, controller_key: payment }
    public: true

  # StripeOrderController - Extended OXID OrderController with Stripe payment integration
  OxidEsales\Payments\Stripe\Controller\StripeOrderController:
    tags:
      - { name: oxid.view_controller, controller_key: order }
    public: true

  # ==========================================
  # Webhook Handlers (Sprint 13)
  # ==========================================

  # PaymentIntentSucceededHandler - Handles payment_intent.succeeded webhooks
  # Sprint 16: Uses OrderPaymentStateService for OXPAID updates (DRY)
  # Sprint 18: Uses ContractFulfillmentService for DRY fulfillment
  OxidEsales\Payments\Stripe\WebhookHandler\PaymentIntentSucceededHandler:
    arguments:
      $orderPaymentStateService: '@OxidEsales\PaymentComponent\Service\OrderPaymentStateServiceInterface'
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $contractFulfillmentService: '@OxidEsales\PaymentComponent\Service\ContractFulfillmentServiceInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: false

  # ==========================================
  # OXPAID Reconciliation (Sprint 10)
  # ==========================================
  # Service and console command for reconciling OXPAID with Stripe API.
  # Handles cases where webhooks were missed or delayed.

  # Event File Logger Factory - Creates logger with correct shop path
  # Sprint 25: Logging for event system debugging
  OxidEsales\Payments\Stripe\Service\Factory\EventFileLoggerFactory:
    public: false

  # Event File Logger - Writes to log/osc/stripe_events.log
  # Sprint 25: Debug logging for event handlers
  stripe.events.file_logger:
    class: OxidEsales\PaymentComponent\Service\FileLoggerInterface
    factory: ['@OxidEsales\Payments\Stripe\Service\Factory\EventFileLoggerFactory', 'create']
    public: false

  # Reconciliation File Logger Factory - Creates logger with correct shop path
  # Sprint 14: Factory approach for OXID compatibility (no kernel.project_dir)
  OxidEsales\Payments\Stripe\Service\Factory\ReconciliationFileLoggerFactory:
    public: false

  # Reconciliation File Logger - Writes to log/osc/stripe_reconciliation.log
  # Sprint 14: Injected logger for testability (prevents unit tests writing to production logs)
  stripe.reconciliation.file_logger:
    class: OxidEsales\PaymentComponent\Service\FileLoggerInterface
    factory: ['@OxidEsales\Payments\Stripe\Service\Factory\ReconciliationFileLoggerFactory', 'create']
    public: false

  # Reconciliation Service
  # Sprint 18: Uses ContractFulfillmentService for DRY fulfillment
  OxidEsales\Payments\Stripe\Service\OxpaidReconciliationService:
    arguments:
      $connection: '@doctrine.dbal.connection'
      $adapterFactory: '@OxidEsales\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface'
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $contractFulfillmentService: '@OxidEsales\PaymentComponent\Service\ContractFulfillmentServiceInterface'
      $fileLogger: '@stripe.reconciliation.file_logger'
    public: true

  # Console Command: stripe:reconcile-oxpaid
  OxidEsales\Payments\Stripe\Command\ReconcileOxpaidCommand:
    arguments:
      $reconciliationService: '@OxidEsales\Payments\Stripe\Service\OxpaidReconciliationService'
    tags:
      - { name: 'console.command', command: 'stripe:reconcile-oxpaid' }
    public: true

  # ==========================================
  # Sprint 2: Condition Handlers (Stock & Fraud)
  # ==========================================
  # These handlers manage stock reservation/release and fraud checking
  # as contract conditions. Can be disabled via admin configuration.
  #
  # Stock Reservation:
  # - ON: Reserves stock on contract creation (DRAFT), releases on terminal states
  # - OFF: No stock manipulation, OXID handles stock normally on order creation
  #
  # Fraud Check:
  # - ON: Checks Stripe Radar score after payment authorization
  # - OFF: Fraud check condition immediately fulfilled

  # Stock Service - OXID implementation for direct OXSTOCK manipulation
  # Uses DBAL to decrement/increment oxarticles.OXSTOCK directly
  OxidEsales\PaymentComponent\Service\StockServiceInterface:
    class: OxidEsales\PaymentComponent\Service\OxidStockService
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: false

  # Stock Reservation Handler - Reserves stock on contract creation (DRAFT)
  # Priority 90: Runs early to reserve stock before other handlers
  # Can fail contract creation if insufficient stock
  OxidEsales\PaymentComponent\EventSystem\Handler\StockReservationHandler:
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $stockService: '@OxidEsales\PaymentComponent\Service\StockServiceInterface'
      $enabled: '%payment.stock_reservation.enabled%'
    tags:
      - { name: payment.event_handler, priority: 90 }
    public: false

  # Stock Release Handler - Releases stock on terminal states (CANCELLED, EXPIRED, FAILED)
  # Does NOT release on FULFILLED (order completed, stock stays reserved)
  # Throws StockReleaseException on failure (strict consistency)
  OxidEsales\PaymentComponent\EventSystem\Handler\StockReleaseHandler:
    arguments:
      $stockService: '@OxidEsales\PaymentComponent\Service\StockServiceInterface'
      $enabled: '%payment.stock_reservation.enabled%'
    tags:
      - { name: payment.event_handler }
    public: false

  # Fraud Check Handler - Checks fraud score on payment authorization
  # Priority 85: Runs after stock reservation, before order creation
  # Binary pass/fail only - no manual review
  # On failure: contract is failed (will trigger stock release)
  OxidEsales\PaymentComponent\EventSystem\Handler\FraudCheckHandler:
    arguments:
      $contractRepository: '@OxidEsales\PaymentComponent\Repository\ContractRepositoryInterface'
      $fraudCheckService: '@OxidEsales\PaymentComponent\Service\FraudCheckServiceInterface'
      $enabled: '%payment.fraud_check.enabled%'
    tags:
      - { name: payment.event_handler, priority: 85 }
    public: false

  # Stripe Radar Fraud Check Service - Checks Stripe Radar score
  # Default threshold: 0.7 (score >= 0.7 fails)
  # Implementation in Stripe module, interface in payment-component
  OxidEsales\PaymentComponent\Service\FraudCheckServiceInterface:
    class: OxidEsales\Payments\Stripe\Service\StripeRadarFraudCheckService
    arguments:
      $adapterFactory: '@OxidEsales\Payments\Stripe\Service\Factory\StripeAdapterFactoryInterface'
      $threshold: '%payment.fraud_check.threshold%'
    public: false

# ==========================================
# Parameters for Sprint 2 Condition Handlers
# ==========================================
# These can be overridden in shop configuration or environment

parameters:
  # Stock reservation toggle (default: enabled)
  payment.stock_reservation.enabled: true

  # Fraud check toggle (default: enabled)
  payment.fraud_check.enabled: true

  # Fraud check threshold (default: 0.7 = 70% risk score)
  # Scores >= threshold fail the fraud check
  payment.fraud_check.threshold: 0.7
