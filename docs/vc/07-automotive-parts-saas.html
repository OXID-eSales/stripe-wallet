<h2 id="problem-automotive-aftermarket-is-stuck-in-the-1990s">Problem: Automotive Aftermarket Is Stuck in the 1990s</h2>
<div class="feature-box">
<h3>The Current Reality</h3>
<p>Over <strong>70% of independent garages</strong> source parts through <strong>wholesalers</strong> (CLEPA data). Yet the ordering process is painfully analog.</p>
</div>
<div class="grid-2">
<div>
<h3 id="for-repair-shops-buyers">For Repair Shops (Buyers)</h3>
<p><strong>Pain Points:</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Phone calls to 5-10 distributors for price checks</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> No real-time inventory visibility</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Wrong parts ordered (fitment errors)</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 20-30% of time wasted on parts procurement</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> No price comparison = overpaying</li>
</ul>
<p><strong>Impact:</strong></p>
<ul>
<li>Lost productivity: 5-8 hours/week per mechanic</li>
<li>Wrong parts: 15% of orders need returns</li>
<li>Margin erosion: Overpaying 10-25% vs market</li>
</ul>
</div>
<div>
<h3 id="for-distributors-sellers">For Distributors (Sellers)</h3>
<p><strong>Pain Points:</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Phone/fax orders = manual data entry</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> No digital catalog (just PDF price lists)</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Can't reach new customers online</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Price updates = call every customer</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Losing market share to Amazon Business</li>
</ul>
<p><strong>Impact:</strong></p>
<ul>
<li>High operational costs: €150K-300K/year for order processing</li>
<li>Customer churn: 15-20%/year to digital-first competitors</li>
<li>Limited growth: Can't scale beyond local region</li>
</ul>
</div>
</div>

<h2 id="solution-partsconnect---b2b-marketplace-platform">Solution: PartsConnect - B2B Marketplace Platform</h2>
<div class="feature-box">
<h3>White-Label SaaS for Auto Parts Distributors</h3>
<p>We provide the technology infrastructure. Distributors get their own branded marketplace to sell to repair shops.</p>
</div>
<h3 id="core-features">Core Features</h3>
<div class="grid-3">
<div class="metric" style="border-color: #ff6b00;">
<h3>🔍 VIN Decoder</h3>
<p>AI-powered vehicle identification<br />→ instant parts catalog</p>
</div>
<div class="metric" style="border-color: #00ff00;">
<h3>📦 Inventory Sync</h3>
<p>Real-time stock levels<br />from ERP systems</p>
</div>
<div class="metric" style="border-color: #ff00ff;">
<h3>🤖 Fitment Engine</h3>
<p>Cross-reference database<br />eliminates wrong orders</p>
</div>
</div>
<h3 id="platform-architecture">Platform Architecture</h3>
<ul>
<li><strong>Frontend:</strong> Twig templates (OXID 7 native), responsive design</li>
<li><strong>Backend:</strong> PHP 8.2, Symfony 6, MySQL 8.0</li>
<li><strong>Integrations:</strong> REST API for ERP (SAP, MS Dynamics, custom)</li>
<li><strong>Data:</strong> TecDoc fitment database (650K+ parts, 180K+ vehicles)</li>
<li><strong>Hosting:</strong> Docker, Kubernetes, AWS/Azure (multi-tenant SaaS)</li>
<li><strong>Security:</strong> GDPR compliant, PCI DSS for payments</li>
</ul>

<h2 id="how-it-works-value-chain">How It Works: Value Chain</h2>
<div class="grid-2">
<div>
<h3 id="for-distributors-our-customers">For Distributors (Our Customers)</h3>
<p><strong>Step 1: Onboarding (Week 1-2)</strong></p>
<ul>
<li>Upload product catalog (CSV/API)</li>
<li>Configure branding (logo, colors, domain)</li>
<li>ERP integration (stock sync)</li>
<li>Staff training (2-day workshop)</li>
</ul>
<p><strong>Step 2: Launch (Week 3)</strong></p>
<ul>
<li>Invite existing customers (repair shops)</li>
<li>Digital marketing campaign</li>
<li>Go-live with white-label marketplace</li>
</ul>
<p><strong>Step 3: Growth (Month 1+)</strong></p>
<ul>
<li>Analytics dashboard (sales, popular parts)</li>
<li>Automatic reorder suggestions (AI)</li>
<li>Expand to new customer segments</li>
</ul>
</div>
<div>
<h3 id="for-repair-shops-end-users">For Repair Shops (End Users)</h3>
<p><strong>Step 1: Registration</strong></p>
<ul>
<li>Invited by their distributor</li>
<li>Free account creation</li>
<li>Credit terms pre-approved</li>
</ul>
<p><strong>Step 2: Order Parts</strong></p>
<ul>
<li>Enter VIN or search by part number</li>
<li>See real-time inventory &amp; pricing</li>
<li>Compare prices across multiple distributors</li>
<li>Add to cart, checkout (net 30/60 terms)</li>
</ul>
<p><strong>Step 3: Track &amp; Repeat</strong></p>
<ul>
<li>Order tracking, delivery updates</li>
<li>Invoice downloads</li>
<li>Reorder previous orders (1-click)</li>
</ul>
</div>
</div>
<div class="gold">
<strong>Network Effect:</strong> As more distributors join, repair shops have more parts options in one place. As more shops join, distributors get more volume. The platform becomes indispensable to both sides!
</div>

<li>Distributors cut costs = need our efficiency more</li>
<li>Sticky SaaS revenue (multi-year contracts)</li>
</ul>
</div>
</div>

<h2 id="why-now-market-timing">Why Now? Market Timing</h2>
<div class="feature-box">
<h3>The Perfect Storm for Automotive B2B Digitalization</h3>
<p>Three macro trends converging in 2025-2027:</p>
</div>
<h3 id="1-post-covid-digital-acceleration">1. Post-COVID Digital Acceleration</h3>
<ul>
<li>COVID forced 5 years of digital adoption in 1 year</li>
<li>90% of German firms expect &gt;50% of purchases online by 2025 (our research)</li>
<li>Repair shops now comfortable with B2B e-commerce (vs skeptical in 2019)</li>
<li>Distributors losing customers to Amazon = urgency to digitize</li>
</ul>
<h3 id="2-technology-maturity">2. Technology Maturity</h3>
<ul>
<li>PHP 8.2 = 2-3x faster than old PHP 5.6 (most OXID shops still on!)</li>
<li>Cloud costs dropped 80% since 2015 (makes SaaS profitable)</li>
<li>AI/ML accessible (VIN decoding was impossible 5 years ago)</li>
<li>TecDoc API modernization (2023) = easier integration</li>
</ul>
<h3 id="3-regulatory-tailwinds">3. Regulatory Tailwinds</h3>
<ul>
<li><strong>EU Digital Markets Act (2024):</strong> Favors interoperability (helps us vs walled gardens)</li>
<li><strong>EU Green Deal:</strong> Vehicle lifespan extension = more aftermarket repairs</li>
<li><strong>Right to Repair laws:</strong> Independent shops gain more market share (our customers!)</li>
</ul>
<div class="gold">
<strong>Window of Opportunity:</strong> 2-3 years before big players (Amazon, Bosch) catch up. First-mover advantage = winner takes most in platform markets!
</div>

<h2 id="why-competitors-will-fail-and-we-wont">Why Competitors Will Fail (And We Won't)</h2>
<div class="grid-2">
<div>
<h3 id="why-amazon-business-will-fail">Why Amazon Business Will Fail</h3>
<p><strong>Their Weaknesses:</strong></p>
<ol>
<li><strong>Generic platform</strong> (no fitment data, wrong parts = returns)</li>
<li><strong>High fees</strong> (15% take rate vs our 1.8%)</li>
<li><strong>No B2B expertise</strong> (net 30/60 terms? Nope!)</li>
<li><strong>Distributors fear them</strong> (Amazon = competitor, not partner)</li>
<li><strong>US company</strong> (GDPR concerns, data sovereignty)</li>
</ol>
<p><strong>What They'd Need:</strong></p>
<ul>
<li>License TecDoc: €45K/year</li>
<li>Build VIN decoder: €150K</li>
<li>B2B credit management: €200K</li>
<li>Win distributor trust: Impossible (they're the enemy!)</li>
</ul>
<p><strong>Probability Amazon builds this:</strong> 5-10% (not their focus)</p>
</div>
<div>
<h3 id="why-generic-startups-will-fail">Why Generic Startups Will Fail</h3>
<p><strong>Their Weaknesses:</strong></p>
<ol>
<li><strong>No distribution</strong> (must cold-call 8,500 distributors)</li>
<li><strong>No technology</strong> (build e-commerce from scratch = €720K, 33 months)</li>
<li><strong>No trust</strong> (unknown brand in conservative industry)</li>
<li><strong>No automotive expertise</strong> (wrong features = no PMF)</li>
<li><strong>Capital inefficient</strong> (need €5M+ to reach €10M ARR)</li>
</ol>
<p><strong>What They'd Need:</strong></p>
<ul>
<li>Raise €5M Series A: 12-18 months</li>
<li>Build technology: 24-36 months</li>
<li>Acquire customers: 36-48 months</li>
<li><strong>Total: 6-8 years to where we'll be in Year 2!</strong></li>
</ul>
<p><strong>Probability generic startup succeeds:</strong> 15-20% (industry avg)</p>
</div>
</div>
<h3 id="why-oscoxid-will-succeed">Why OSC/OXID Will Succeed</h3>

<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Technology ready</strong> (OXID 7, saves €640K)<br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Trust established</strong> (20 years, Mercedes customer)<br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Automotive DNA</strong> (we understand the market deeply)<br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Capital efficient</strong> (€650K → €10M ARR in 18 months)<br />
