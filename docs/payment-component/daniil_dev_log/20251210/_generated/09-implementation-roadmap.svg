<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1466px" preserveAspectRatio="none" style="width:1154px;height:1466px;background:#FEFEFE;" version="1.1" viewBox="0 0 1154 1466" width="1154px" zoomAndPan="magnify"><title>Implementation Roadmap for finalizeOrder() Problem Resolution</title><defs/><g><rect fill="#FEFEFE" height="1466" style="stroke:none;stroke-width:1;" width="1154" x="0" y="0"/><g class="title" data-source-line="2"><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="803.9561" x="173.5374" y="35.4209">Implementation Roadmap for finalizeOrder() Problem Resolution</text></g><rect fill="#FFFFFF" height="20.9531" style="stroke:#FFFFFF;stroke-width:1;" width="1131.0308" x="10" y="54.3545"/><rect fill="#E8F5E9" height="1286.7031" style="stroke:#E8F5E9;stroke-width:1;" width="243.3145" x="10" y="54.3545"/><ellipse cx="132.6572" cy="90.3076" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="186.2305" x="39.542" y="120.3076"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="166.2305" x="49.542" y="141.4463">Document current behavior</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="135.9551" x="49.542" y="155.415">in detail (this analysis)</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="205.3555" x="29.9795" y="188.2451"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="167.7656" x="39.9795" y="209.3838">Add comprehensive logging</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="185.3555" x="39.9795" y="223.3525">at all finalizeOrder() call points</text><rect fill="#FFFFFF" height="103.8125" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="188.0234" x="38.6455" y="256.1826"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="163.2949" x="48.6455" y="277.3213">Create integration tests for</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="168.0234" x="48.6455" y="291.29">all order creation scenarios:</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="121.5469" x="48.6455" y="305.2588">- Standard checkout</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="145.0957" x="48.6455" y="319.2275">- Stripe Checkout return</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="154.1191" x="48.6455" y="333.1963">- Stripe Payment Element</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="146.6426" x="48.6455" y="347.165">- Webhook-first scenario</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="194.1113" x="35.6016" y="379.9951"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="115.8398" x="45.6016" y="401.1338">Review and update</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="174.1113" x="45.6016" y="415.1025">Stripe\Model\Order overrides</text><line style="stroke:#000000;stroke-width:1;" x1="10" x2="10" y1="54.3545" y2="1341.0576"/><rect fill="#E3F2FD" height="1286.7031" style="stroke:#E3F2FD;stroke-width:1;" width="283.5" x="253.3145" y="54.3545"/><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="240.8984" x="275.6152" y="447.9326"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="220.8984" x="285.6152" y="469.0713">Create SessionStateManager service</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="207.2227" x="285.6152" y="483.04">to centralize session management</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="273.5" x="259.3145" y="515.8701"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="225.2695" x="269.3145" y="537.0088">Create ContractOrderCreationService</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="253.5" x="269.3145" y="550.9775">as wrapper around OxidShopOrderService</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="177.957" x="307.0859" y="583.8076"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="157.957" x="317.0859" y="604.9463">Implement pre/post hooks</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="137.543" x="317.0859" y="618.915">for finalizeOrder() calls</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="217.4844" x="287.3223" y="651.7451"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="197.4844" x="297.3223" y="672.8838">Add idempotency via contract ID</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="153.7969" x="297.3223" y="686.8525">instead of sess_challenge</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="188.1055" x="302.0117" y="719.6826"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="168.1055" x="312.0117" y="740.8213">Improve error handling with</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="117.6855" x="312.0117" y="754.79">specific error codes</text><line style="stroke:#000000;stroke-width:1;" x1="253.3145" x2="253.3145" y1="54.3545" y2="1341.0576"/><rect fill="#FFF3E0" height="1286.7031" style="stroke:#FFF3E0;stroke-width:1;" width="341.3496" x="536.8145" y="54.3545"/><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="331.3496" x="542.8145" y="787.6201"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="186.6211" x="552.8145" y="808.7588">Handle webhook-first scenario:</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="311.3496" x="552.8145" y="822.7275">- Webhook marks contract as "payment_confirmed"</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="148.0195" x="552.8145" y="836.6963">- User return checks flag</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="240.9609" x="552.8145" y="850.665">- Background job for abandoned returns</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="186.6934" x="615.1426" y="883.4951"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="166.6934" x="625.1426" y="904.6338">Add contract state machine</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="132.2285" x="625.1426" y="918.6025">visualization to admin</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="226.0742" x="595.4521" y="951.4326"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="206.0742" x="605.4521" y="972.5713">Create order recovery mechanism</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="174.6035" x="605.4521" y="986.54">for failed finalizeOrder() calls</text><rect fill="#FFFFFF" height="61.9063" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="180.8398" x="618.0693" y="1019.3701"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="159.1992" x="628.0693" y="1040.5088">Performance optimization:</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="160.8398" x="628.0693" y="1054.4775">- Reduce database queries</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="149.373" x="628.0693" y="1068.4463">- Cache contract lookups</text><line style="stroke:#000000;stroke-width:1;" x1="536.8145" x2="536.8145" y1="54.3545" y2="1341.0576"/><rect fill="#FCE4EC" height="1286.7031" style="stroke:#FCE4EC;stroke-width:1;" width="261.0059" x="878.1641" y="54.3545"/><rect fill="#FFFFFF" height="61.9063" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="217.332" x="901.001" y="1101.2764"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="197.332" x="911.001" y="1122.415">Evaluate OXID core contribution:</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="173.4316" x="911.001" y="1136.3838">- Event-based finalizeOrder()</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="164.8477" x="911.001" y="1150.3525">- Would benefit all modules</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="251.0059" x="884.1641" y="1183.1826"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="169.3652" x="894.1641" y="1204.3213">Consider full contract-based</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="231.0059" x="894.1641" y="1218.29">order creation (bypass finalizeOrder())</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="218.5918" x="900.3711" y="1251.1201"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="137.0039" x="910.3711" y="1272.2588">Multi-payment support</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="198.5918" x="910.3711" y="1286.2275">(partial payments, subscriptions)</text><ellipse cx="1009.667" cy="1330.0576" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="1009.667" cy="1330.0576" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="878.1641" x2="878.1641" y1="54.3545" y2="1341.0576"/><line style="stroke:#000000;stroke-width:1;" x1="1139.1699" x2="1139.1699" y1="54.3545" y2="1341.0576"/><line style="stroke:#000000;stroke-width:1;" x1="132.6572" x2="132.6572" y1="100.3076" y2="120.3076"/><polygon fill="#000000" points="128.6572,110.3076,132.6572,120.3076,136.6572,110.3076,132.6572,114.3076" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="132.6572" x2="132.6572" y1="168.2451" y2="188.2451"/><polygon fill="#000000" points="128.6572,178.2451,132.6572,188.2451,136.6572,178.2451,132.6572,182.2451" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="132.6572" x2="132.6572" y1="236.1826" y2="256.1826"/><polygon fill="#000000" points="128.6572,246.1826,132.6572,256.1826,136.6572,246.1826,132.6572,250.1826" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="132.6572" x2="132.6572" y1="359.9951" y2="379.9951"/><polygon fill="#000000" points="128.6572,369.9951,132.6572,379.9951,136.6572,369.9951,132.6572,373.9951" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="396.0645" 